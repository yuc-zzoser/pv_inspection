const catalog=JSON.parse(document.getElementById('catalog').textContent);const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const now=()=>new Date().toISOString();let db=null,project=null,page='home',selectedArea='grid',idx=0,lang=localStorage.getItem('pv-lang')||'de';$('language').value=lang;const t=(de,en)=>lang==='de'?de:en;const status=s=>{$('saveStatus').textContent=s};

function roster(){if(!Array.isArray(project.inspectors)){const persons=(project.days||[]).flatMap(x=>x.people||[]).filter(x=>x.name?.trim());let seen=new Set();project.inspectors=persons.filter(p=>{let key=p.name.trim().toLowerCase();if(seen.has(key))return false;seen.add(key);return true}).map(p=>({...p,id:p.id||crypto.randomUUID()}))}return project.inspectors}
function lead(){let r=roster();return r.find(p=>p.id===project.leadInspectorId)||r[0]||null}

function openDb(){return new Promise((ok,no)=>{let r=indexedDB.open('pv-field-db',1);r.onupgradeneeded=()=>{let d=r.result;d.createObjectStore('projects',{keyPath:'id'});d.createObjectStore('app',{keyPath:'key'})};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}function put(store,v){return new Promise((ok,no)=>{const tr=db.transaction(store,'readwrite');tr.objectStore(store).put(v);tr.oncomplete=()=>ok();tr.onerror=()=>no(tr.error);tr.onabort=()=>no(tr.error)})}function getAll(store){return new Promise((ok,no)=>{let tr=db.transaction(store);let r=tr.objectStore(store).getAll();r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}let queue=Promise.resolve();function save(){project.meta.modified=now();status(t('Wird gespeichert…','Saving…'));const snapshot=structuredClone(project);queue=queue.catch(()=>{}).then(()=>put('projects',snapshot)).then(()=>put('app',{key:'current',id:project.id})).then(()=>{status(t('✓ Lokal gespeichert','✓ Saved locally'))}).catch(e=>{status(t('⚠ Speicherfehler','⚠ Save failed'));alert(t('Speicherung fehlgeschlagen: ','Saving failed: ')+e.message)});return queue}function change(path,val){let o=project;const p=path.split('.');for(let i=0;i<p.length-1;i++)o=o[p[i]];o[p.at(-1)]=val;save()}function touchInput(el,fn){el.addEventListener('input',e=>fn(e.target.value));el.addEventListener('change',e=>fn(e.target.value))}function field(label,val,fn,type='text'){const id='f'+Math.random().toString(36).slice(2);return `<label class="field"><span>${label}</span><input id="${id}" ${type==='number'?'inputmode="decimal"':''} type="${type}" value="${esc(val)}"></label>`}
function bindField(id,fn){let el=$(id);if(el)touchInput(el,fn)}function elField(label,key){const id='p_'+key;return `<label class="field"><span>${label}</span><input id="${id}" value="${esc(project[key])}"></label>`}function cField(label,key){const id='c_'+key;return `<label class="toggle"><input id="${id}" type="checkbox" ${project.config[key]?'checked':''}> ${label}</label>`}function bindConfig(){for(let k of ['trafo','tracker','bifacial','gak','remote','storage','fpv','apv'])$('c_'+k).onchange=e=>{change('config.'+k,e.target.checked);render()};for(let k of ['voltage','inv'])$('c_'+k).onchange=e=>{change('config.'+k,e.target.value);render()}}
function activeAreas(){return catalog.areas.filter(a=>!['trafo','storage','fpv','apv'].includes(a.id)||project.config[a.id])}function checks(area){let full=catalog.checks.concat(project.custom).filter(c=>c.area===area);return full.filter(c=>!c.condition||project.config[c.condition]||c.condition==='gak'&&project.config.gak)}function allChecks(){return activeAreas().flatMap(a=>checks(a.id))}function count(area){const c=checks(area),done=c.filter(x=>['pass','fail','na'].includes(project.results[x.id]?.status)).length;return [done,c.length]}function day(){return project.days.at(-1)}function addDay(){project.days.push({id:crypto.randomUUID(),date:new Date().toISOString().slice(0,10),start:'',end:'',weather:'',temp:'',wind:'',irr:'',notes:'',people:[{id:crypto.randomUUID(),name:'',company:'',role:'',from:'',to:''}]});save()}
function nav(){let entries=[['home','Projekte','Projects'],['config','Konfiguration','Configuration'],['day','Prüftag','Inspection day'],['areas','Bereiche','Sections'],['guided','Geführt','Guided'],['defects','Mängel','Defects'],['export','Sicherung','Backup']];$('nav').innerHTML=entries.map(([id,de,en])=>`<button data-page="${id}" class="${page===id?'active':''}">${t(de,en)}</button>`).join('');$('nav').querySelectorAll('button').forEach(b=>b.onclick=()=>go(b.dataset.page))}function go(p){page=p;render();window.scrollTo(0,0)}function selectArea(id){selectedArea=id;idx=0;project.lastArea=id;project.lastCheck=0;save();go('check')}function next(n){let c=checks(selectedArea);idx=Math.max(0,Math.min(c.length-1,n));project.lastArea=selectedArea;project.lastCheck=idx;save();render();window.scrollTo(0,0)}function render(){nav();let body=({home:home,config:configPage,day:dayPage,areas:areasPage,guided:guidedPage,check:checkPage,defects:defectsPage,export:exportPage})[page]();$('app').innerHTML=body;bind()}
function home(){const c=allChecks(),done=c.filter(x=>['pass','fail','na'].includes(project.results[x.id]?.status)).length;return `<h1>${t('Projektübersicht','Project overview')}</h1><div class="card"><h2>${esc(project.name||t('Unbenannte Anlage','Unnamed plant'))}</h2><p>${esc(project.site||t('Standort noch offen','Location not provided'))}</p><p><strong>${done} / ${c.length}</strong> ${t('Prüfungen abgeschlossen','checks completed')}</p><div class="bar"><div style="width:${c.length?done/c.length*100:0}%"></div></div><p class="muted small">${t('Letzte lokale Änderung','Last local modification')}: ${new Date(project.meta.modified).toLocaleString(lang)}</p><div class="row"><button class="primary" onclick="go('guided')">${t('Prüfung fortsetzen →','Continue inspection →')}</button><button onclick="go('config')">${t('Anlage konfigurieren','Configure plant')}</button></div></div><div class="card"><h2>${t('Projekte','Projects')}</h2><div id="projectList"></div><div class="row"><button onclick="newProject()">+ ${t('Neue Anlage','New plant')}</button></div></div><p class="note">${t('Alle bestätigten Änderungen werden lokal im aktuellen Browser gespeichert. Bitte regelmäßig ein Backup auf einem anderen Datenträger erstellen.','All confirmed changes are saved locally in this browser. Export backups regularly to another device.')}</p>`}

function checkPage(){let arr=checks(selectedArea),c=arr[idx];if(!c)return `<h1>${t('Keine Prüfpunkte','No checks')}</h1><button onclick="addCustom('${selectedArea}')">+ ${t('Prüfpunkt','Check')}</button>`;let r=project.results[c.id]||{status:'pending',part:'',wr:'',table:'',string:'',serial:'',inspector:lead()?.name||'',note:'',severity:'S2',owner:'',due:'',evidence:'',created:now(),modified:now(),dayId:day()?.id||'',history:[]};let a=catalog.areas.find(v=>v.id===selectedArea);let options=['pass','fail','na','pending'];let labels={pass:t('✓ Bestanden','✓ Pass'),fail:t('✕ Mangel','✕ Fail'),na:t('— Entfällt','— N/A'),pending:t('◷ Offen','◷ Pending')};return `<div class="row between"><button onclick="go('areas')">← ${t('Bereiche','Sections')}</button><span class="pill">${idx+1} / ${arr.length}</span></div><div class="card"><div class="row between"><span class="pill">${esc(c.id)}</span><span>${esc(a?.[lang]||selectedArea)}</span></div><h1>${esc(c[lang])}</h1><p class="note"><strong>${t('Prüfmethode','Inspection method')}:</strong><br>${esc(c['method_'+lang])}</p><div class="row"><button onclick="addCustom('${selectedArea}')">+ ${t('Prüfpunkt','Check')}</button><button onclick="addFinding('${selectedArea}')">+ ${t('Befund','Finding')}</button></div><h2>${t('Prüfobjekt','Inspected object')}</h2><div class="two">${[['part',t('Anlagenteil','Plant section')],['wr',t('WR-Nr.','Inverter no.')],['table',t('Tisch','Table')],['string',t('Strang','String')],['serial',t('Modul-Seriennummer','Module serial')]].map(([k,l])=>`<label class="field"><span>${l}</span><input data-result="${k}" value="${esc(r[k])}"></label>`).join('')}</div>${inspectorSelect(r)}<h2>${t('Ergebnis','Result')}</h2><div class="result-grid">${options.map(x=>`<button class="${x} ${r.status===x?'selected':''}" onclick="setResult('${c.id}','status','${x}')">${labels[x]}</button>`).join('')}</div><details ${r.status==='fail'?'open':''}><summary>${t('Befund / zusätzliche Angaben','Finding / additional information')}< function exportPage(){return `<h1>${t('Bericht & Sicherung','Report & backup')}</h1><div class="card"><h2>${t('Vollständiges Backup','Full backup')}</h2><p>${t('JSON-Sicherung inklusive Prüfungen, Konfiguration, Fotos und Historie. Die Datei an einem zweiten Speicherort ablegen.','JSON backup including results, configuration, photos and history. Save it separately.')}</p><button class="primary" onclick="backup()">↓ ${t('Backup herunterladen','Download backup')}</button><label class="field"><span>${t('Backup importieren','Import backup')}</span><input id="restore" type="file" accept="application/json,.json"></label><p class="muted small">${t('Import ersetzt nicht stillschweigend bestehende Projekte.','Import does not silently overwrite an existing project.')}</p></div><div class="card"><h2>${t('Prüfergebnisse exportieren','Export inspection results')}</h2><button onclick="csv()">↓ CSV (${t('Excel-kompatibel','Excel-compatible')})</button><button onclick="printInspection()">${t('Drucken / PDF','Print / PDF')}</button></div><div class="note">${t('Wichtig: Browserdaten können gelöscht werden. Die Anwendung bietet keine absolute Sicherung gegen Geräteverlust.','Browser data may be deleted. The app cannot guarantee protection against device loss.')}</div>`}
function ensureResult(id){if(!project.results[id])project.results[id]={status:'pending',part:'',wr:'',table:'',string:'',serial:'',inspector:lead()?.name||'',note:'',severity:'S2',owner:'',due:'',evidence:'',photos:[],created:now(),modified:now(),dayId:day()?.id||'',history:[]};return project.results[id]}
function setResult(id,k,v){if(k==='status'&&!roster().some(p=>p.name?.trim())){alert(t('Bitte zuerst mindestens einen Prüfer unter Prüftag eintragen.','Please enter at least one inspector in Inspection day first.'));go('day');return}const r=ensureResult(id);if(!r.inspector&&lead())r.inspector=lead().name;const old=r[k];if(old===v)return;r[k]=v;r.modified=now();r.history.push({at:r.modified,field:k,old,new:v});save();if(k==='status')render()}
function bind(){if(page==='home'){getAll('projects').then(p=>{let el=$('projectList');if(!el)return;el.innerHTML=p.map(x=>`<div class="row between card"><div><strong>${esc(x.name||t('Ohne Namen','Unnamed'))}</strong><br><small>${esc(x.site)} · ${new Date(x.meta.modified).toLocaleString(lang)}</small></div><button data-open="${x.id}">${t('Öffnen','Open')}</button></div>`).join('');el.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openProject(b.dataset.open))})}if(page==='config'){for(let k of ['name','site','owner','dso','dc','ac'])bindField('p_'+k,v=>change(k,v));$('c_voltage').value=project.config.voltage;$('c_inv').value=project.config.inv;bindConfig()}if(page==='day'){let d=day();$('daySelect').onchange=e=>{let i=project.days.findIndex(x=>x.id===e.target.value);if(i!==-1){let x=project.days.splice(i,1)[0];project.days.push(x);save();render()}};for(let k of ['date','start','end','weather','temp','wind','irr','notes'])bindField('day_'+k,v=>{d[k]=v;save()});document.querySelectorAll('[data-inspector]').forEach(el=>touchInput(el,v=>{let p=roster().find(x=>x.id===el.dataset.inspector);if(p){p[el.dataset.key]=v;if(!project.leadInspectorId)project.leadInspectorId=p.id;save()}}));$('leadInspector').onchange=e=>{project.leadInspectorId=e.target.value;save()}}if(page==='check'){const c=checks(selectedArea)[idx];if(!c)return;document.querySelectorAll('[data-result]').forEach(el=>{let r=ensureResult(c.id);touchInput(el,v=>setResult(c.id,el.dataset.result,v))});let pic=$('photoInput');if(pic)pic.onchange=async e=>{for(let file of e.target.files){if(file.size>8*1024*1024){alert(t('Foto über 8 MB. Bitte kleinere Datei wählen.','Photo exceeds 8MB. Choose a smaller file.'));continue}let data=await new Promise((ok,no)=>{const f=new FileReader();f.onload=()=>ok(f.result);f.onerror=()=>no(f.error);f.readAsDataURL(file)});let r=ensureResult(c.id);r.photos.push({name:file.name&&file.name!=='image.jpg'?file.name:'Foto_'+c.id+'_'+new Date().toISOString().replace(/[:.]/g,'-')+'.jpg',originalName:file.name||'',mime:file.type,data,at:now()});r.modified=now();await save()}render()}}if(page==='export'){$('restore').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let obj=JSON.parse(await f.text());if(obj.format!=='pv-inspection-backup-1'||!obj.project?.id)throw Error('Invalid format');let incoming=obj.project;const existing=(await getAll('projects')).find(x=>x.id===incoming.id);if(existing){if(!confirm(t('Projekt besteht bereits. Als Kopie importieren?','Project exists. Import as new copy?')))return;incoming.id=crypto.randomUUID();incoming.name+=' (Import)'}await put('projects',incoming);project=incoming;await save();go('home')}catch(e){alert(t('Import fehlgeschlagen: ','Import failed: ')+e.message)}}}}
function addPerson(){day().people.push({id:crypto.randomUUID(),name:'',company:'',role:'',from:'',to:''});save();render()}function removePerson(id){day().people=day().people.filter(p=>p.id!==id);save();render()}async function newProject(){if(!confirm(t('Neue Anlage anlegen? Die bisherigen Daten bleiben erhalten.','Create new plant? Existing data are retained.')))return;project=defaultProject();await save();go('config')}async function openProject(id){let x=(await getAll('projects')).find(v=>v.id===id);if(x){project=x;await save();go('home')}}function sameNext(){let c=checks(selectedArea)[idx],r=ensureResult(c.id);const clone=structuredClone(r);let id=c.id+'~'+crypto.randomUUID().slice(0,8);project.custom.push({...c,id,de:c.de+' (weiteres Prüfobjekt)',en:c.en+' (additional object)',condition:''});project.results[id]={...clone,status:'pending',serial:'',created:now(),modified:now(),history:[],photos:[]};save();idx=checks(selectedArea).findIndex(x=>x.id===id);render()}
function addCustom(area){let title=prompt(t('Neuer Prüfpunkt – Bezeichnung','New check – title'));if(!title?.trim())return;let method=prompt(t('Prüfmethode (optional)','Method (optional)'))||'';let id='USR-'+crypto.randomUUID().slice(0,8).toUpperCase();project.custom.push({id,area,de:title,en:title,method_de:method,method_en:method,condition:''});save();selectedArea=area;idx=checks(area).findIndex(c=>c.id===id);go('check')}
function addFinding(area){let title=prompt(t('Spontaner Befund – Kurzbezeichnung','Ad-hoc finding – title'));if(!title?.trim())return;let note=prompt(t('Befundbeschreibung','Finding description'))||'';project.findings.push({id:crypto.randomUUID(),area,title,note,created:now(),inspector:'',dayId:day()?.id||''});save();go('defects')}
function jump(id){let c=catalog.checks.concat(project.custom).find(x=>x.id===id);if(c){selectedArea=c.area;idx=checks(selectedArea).findIndex(x=>x.id===id);go('check')}}function downloadPhoto(id,i){let p=ensureResult(id).photos[i];if(!p)return;let a=document.createElement('a');a.href=p.data;a.download=p.name||'photo.jpg';a.click()}function removePhoto(id,i){if(!confirm(t('Foto entfernen?','Remove photo?')))return;let r=ensureResult(id);r.photos.splice(i,1);r.modified=now();save();render()}
function printInspection(){const escText=x=>esc(x||'—');const team=roster();const items=allChecks().filter(c=>project.results[c.id]?.status&&project.results[c.id].status!=='pending');const areaName=id=>catalog.areas.find(a=>a.id===id)?.[lang]||id;let out=`<div class="report-title"><h1>PV Inspection · ${escText(project.name)}</h1><p>${escText(project.site)} · ${t('Datum','Date')}: ${new Date().toLocaleDateString(lang)} · ${t('Export','Export')}: ${new Date().toLocaleString(lang)}</p></div><h2>${t('Anlagendaten','Plant details')}</h2><p>${t('Betreiber','Owner')}: ${escText(project.owner)} · ${t('Netzbetreiber','DSO')}: ${escText(project.dso)} · DC: ${escText(project.dc)} kWp · AC: ${escText(project.ac)}</p><h2>${t('Prüfteam','Inspection team')}</h2><p>${team.map(p=>escText(p.name)+' ('+escText(p.company)+')').join('; ')||'—'}</p><p>${t('Verantwortlich','Responsible')}: ${escText(lead()?.name)}</p><h2>${t('Prüfungstage und Wetter','Inspection days and weather')}</h2>${project.days.map(d=>`<p>${escText(d.date)} · ${escText(d.weather)} · ${t('Temperatur','Temperature')}: ${escText(d.temp)} °C · ${t('Wind','Wind')}: ${escText(d.wind)} m/s</p>`).join('')}<h2>${t('Prüfergebnisse','Inspection results')} (${items.length}/${allChecks().length})</h2>`;for(let c of items){let r=project.results[c.id];out+=`<div class="report-card"><strong>${esc(c.id)} · ${esc(areaName(c.area))}: ${esc(c[lang])}</strong><p><b>${esc(r.status.toUpperCase())}</b> · ${t('Prüfer','Inspector')}: ${escText(inspectorValue(r.inspector))}</p><p>${t('Prüfobjekt','Object')}: ${[r.part,r.wr,r.table,r.string,r.serial].filter(Boolean).map(esc).join(' / ')||'—'}</p>${r.note?`<p>${t('Befund','Finding')}: ${esc(r.note)}</p>`:''}<p class="report-meta">${t('Erfasst','Created')}: ${escText(r.created)} · ${t('Geändert','Modified')}: ${escText(r.modified)} · ${t('Schwere','Severity')}: ${escText(r.severity)}</p>${(r.photos||[]).map(p=>`<figure><img class="report-photo" src="${p.data}" alt="${esc(p.name)}"><figcaption>${esc(p.name)}</figcaption></figure>`).join('')}</div>`}out+=`<h2>${t('Spontane Befunde','Additional findings')}</h2>`+project.findings.map(f=>`<div class="report-card"><strong>${esc(f.title)}</strong><p>${esc(f.note)}</p></div>`).join('');const node=$('printReport');node.innerHTML=out;node.setAttribute('aria-hidden','false');setTimeout(()=>window.print(),300)}
window.addEventListener('afterprint',()=>{const node=$('printReport');node.innerHTML='';node.setAttribute('aria-hidden','true')});
function download(name,content,type){const b=new Blob([content],{type});let url=URL.createObjectURL(b);let a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}function backup(){download('PV-Inspection-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify({format:'pv-inspection-backup-1',exported:now(),catalog,project},null,2),'application/json')}function csv(){let h=['ID','DE','EN','Area','Status','Plant section','Inverter','Table','String','Module SN','Inspector','Finding','Severity','Created UTC','Modified UTC'];let body=allChecks().map(c=>{let r=project.results[c.id]||{};return [c.id,c.de,c.en,c.area,r.status||'pending',r.part,r.wr,r.table,r.string,r.serial,r.inspector,r.note,r.severity,r.created,r.modified].map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')});download('PV-Inspection.csv','\ufeff'+[h.join(';'),...body].join('\r\n'),'text/csv;charset=utf-8')}
$('language').onchange=e=>{lang=e.target.value;localStorage.setItem('pv-lang',lang);document.documentElement.lang=lang;render()};async function init(){try{db=await openDb();let projects=await getAll('projects');let s=(await getAll('app')).find(x=>x.key==='current');project=projects.find(x=>x.id===s?.id)||projects[0]||defaultProject();if(!projects.length)await save();if(!project.days.length){addDay();await queue}roster();if(!project.inspectors.length){project.inspectors.push({id:crypto.randomUUID(),name:'',company:'',role:''})}if(!project.leadInspectorId)project.leadInspectorId=project.inspectors[0].id;await save();status(t('✓ Lokal gespeichert','✓ Saved locally'));render();if(navigator.storage?.persist)navigator.storage.persist().catch(()=>{})}catch(e){status('⚠ IndexedDB unavailable');$('app').innerHTML='<div class="card danger"><h1>Lokale Speicherung nicht verfügbar / Local storage unavailable</h1><p>'+esc(e.message)+'</p><p>Browser-Einstellungen prüfen. Ohne zuverlässige lokale Speicherung ist die Datenerfassung deaktiviert.</p></div>'}}init();
</script><script>if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost')){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(console.warn));}</script></body></html>
