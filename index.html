cked","qualification":"Fachprüfer / Competent inspector","sources":"PERMIT","flag":"","area":"docs"},{"id":"DOC-008","de":"Netzanschlusszusage","en":"Grid connection approval","applicability_de":"Alle Anlagen","applicability_en":"All plants","timing_de":"Erstprüfung","timing_en":"Initial","method_de":"VNB-Zusage und Anschlussparameter dokumentieren","method_en":"Review DSO connection approval and parameters","evidence_de":"Netzanschlusszusage","evidence_en":"Grid approval","criterion_de":"Anschluss entspricht dokumentiertem Freigabeumfang","criterion_en":"Connection conforms to approved scope","qualification":"Fachprüfer / Competent inspector","sources":"TAB","flag":"Sicherheitskritisch / Safety-critical","area":"docs"},{"id":"DOC-009","de":"Inbetriebsetzungsprotokolle","en":"Commissioning records","applicability_de":"Alle Anlagen","applicability_en":"All plants","timing_de":"Erstprüfung","timing_en":"Initial","method_de":"Vollständigkeit und Unterschriften prüfen","method_en":"Review completeness and signatures","evidence_de":"Inbetriebsetzungsunterlagen","evidence_en":"Commissioning reports","criterion_de":"Vorgeschriebene Prüfungen und Freigaben dokumentiert","criterion_en":"Required testing and approvals documented","qualification":"Fachprüfer / Competent inspector","sources":"62446;TAB","flag":"","area":"docs"},{"id":"DOC-010","de":"Marktstammdatenregister","en":"Market master data registration","applicability_de":"Alle Anlagen","applicability_en":"All plants","timing_de":"Erstprüfung","timing_en":"Initial","method_de":"Eintrag und Anlagenparameter abgleichen","method_en":"Compare MaStR registration with plant","evidence_de":"MaStR-Registrierungsbestätigung","evidence_en":"MaStR registration confirmation","criterion_de":"Für Anlage und Speicher zutreffende Einträge konsistent","criterion_en":"Applicable plant/storage entries consistent","qualification":"Fachprüfer / Competent inspector","sources":"MASTR","flag":"","area":"docs"},{"id":"DOC-011","de":"Gerätezertifikate und Konformität","en":"Equipment certificates and conformity","applicability_de":"Alle Anlagen","applicability_en":"All plants","timing_de":"Erstprüfung","timing_en":"Initial","method_de":"Erforderliche Zertifikate nach TAR-Anwendungsfall prüfen","method_en":"Review certificates applicable to connection regime","evidence_de":"Gerätezertifikate, TAR-Matrix","evidence_en":"Device certificates, TAR matrix","criterion_de":"Erforderliche Nachweise gültig und gerätespezifisch","criterion_en":"Applicable certificates valid and equipment-specific","qualification":"Fachprüfer / Competent inspector","sources":"FNN4105;FNN4110;NELEV","flag":"","area":"docs"},{"id":"DOC-012","de":"Gewährleistung und Restpunkteliste","en":"Warranty and punch list","applicability_de":"Alle Anlagen","applicability_en":"All plants","timing_de":"Erstprüfung","timing_en":"Initial","method_de":"Fristen und offene Punkte prüfen","method_en":"Review warranty dates and outstanding defects","evidence_de":"PAC/FAC, Restpunkte","evidence_en":"Acceptance records, punch list","criterion_de":"Offene Punkte verantwortet und terminiert","criterion_en":"Outstanding items assigned and dated","qualification":"Fachprüfer / Competent inspector","sources":"EPC;OM","flag":"","area":"docs"},{"id":"MOD-001","de":"Glasbruch","en":"Broken glass","applicability_de":"Alle Anlagen","applicability_en":"All plants","timing_de":"Erstprüfung","timing_en":"Initial","method_de":"Module visuell auf Risse prüfen","method_en":"Visually inspect glazing","evidence_de":"Georeferenzierte Fotos","evidence_en":"Geotagged photos","criterion_de":"Kein gebrochenes Modulglas","criterion_en":"No broken module glazing","qualification":"PV-Fachprüfer / PV inspector","sources":"EPC;OM","flag":"","area":"modules"},{"id":"MOD-002","de":"Zell-/Laminatschäden","en":"Cell or laminate damage","applicability_de":"Alle Anlagen","applicability_en":"All plants","timing_de":"Erstprüfung","timing_en":"Initial","method_de":"Auf Blasen, Verbrennungen und Delamination prüfen","method_en":"Check for bubbles, burns and delamination","evidence_de":"Fotos, Modul-ID","evidence_en":"Photos, module ID","criterion_de":"Keine sicherheitsrelevanten Defekte","criterion_en":"No safety-relevant defects","qualification":"PV-Fachprüfer / PV inspector","sources":"EPC;OM","flag":"","area":"modules"},{"id":"MOD-003","de":"Rahmenschäden","en":"Frame deformation","applicability_de":"Alle Anlagen","applicability_en":"All plants","timing_de":"Erstprüfung","timing_en":"Initial","method_de":"Rahmen auf Verzug und Brüche prüfen","method_en":"Inspect frame for deformation and fractures","evidence_de":"Fotos, Modul-ID","evidence_en":"Photos, module ID","criterion_de":"Keine Schäden außerhalb Herstellerfreigabe","criterion_en":"No defects outside OEM acceptance","qualification":"PV-Fachprüfer / PV inspector","sources":"EPC;OM","flag":"","area":"modules"},{"id":"MOD-004","de":"Modulverschmutzung","en":"Module soiling","applicability_de":"Alle Anlagen","applicability_en":"All plants","timing_de":"Erstprüfung","timing_en":"Initial","method_de":"Flächige Verschmutzung (Staub, Schmutzfilm, Pollen) an repräsentativen Modulen erfassen; Intensität und Verteilung dokumentieren. Lokale starke Ablagerungen separat unter IEA-1-20 prüfen.","method_en":"Assess widespread soiling (dust, dirt film, pollen) on representative modules; record intensity and distribution. Inspect severe local deposits separately under IEA-1-20.","evidence_de":"Fotostichprobe mit Feld-/Reihen-ID, ggf. Soiling-Messung","evidence_en":"Photo samples with array/row ID; soiling measurement if available","criterion_de":"Ausmaß und Relevanz bewertet; Reinigung gemäß standortbezogenem O&M-Konzept veranlasst, sofern erforderlich.","criterion_en":"Extent and impact assessed; cleaning initiated if required by site-specific O&M plan.","qualification":"PV-Fachprüfer / PV inspector","sources":"EPC;OM","flag":"","area":"modules"},{"id":"MOD-005","de":"Modulkennzeichnung","en":"Module identification","applicability_de":"Alle Anlagen","applicability_en":"All plants","timing_de":"Erstprüfung","timing_en":"Initial","method_de":"Lesbarkeit von Typ-/Serienetiketten prüfen","method_en":"Check readability of product labels","evidence_de":"Typenschilderfotos","evidence_en":"Label photos","criterion_de":"Zuordnung zu Geräteliste möglich","criterion_en":"Traceable to equipment register","qualification":"PV-Fachprüfer / PV inspector","sources":"EPC;OM","flag":"","area":"modules"},{"id":"MOD-006","de":"Modulklemmposition gemäß Montageanleitung","en":"Module clamp position per installation manual","applicability_de":"Alle Anlagen","applicability_en":"All plants","timing_de":"Erstprüfung","timing_en":"Initial","method_de":"Montageanleitung für konkreten Modultyp und Montageart prüfen; Abstand der Klemmen zu Modulecken messen.","method_en":"Check the exact module model manual for the mounting configuration; measure clamp-to-corner positions.","evidence_de":"Hersteller-Montageanleitung (Revision), Maßfotos / Stichprobenprotokoll","evidence_en":"Manufacturer installation manual (revision), dimensioned photos / sample record","criterion_de":"Positionen innerhalb der für Montageart/Lastfall freigegebenen Klemmzonen der zutreffenden Anleitung.","criterion_en":"Locations within manufacturer-approved clamping zones for mounting configuration and load case.","qualification":"PV-Fachprüfer / PV inspector","sources":"OEM;EPC","flag":"","area":"modules"},{"id":"MOD-007","de":"Modulklemmfestigkeit","en":"Module clamp integrity","applicability_de":"Alle Anlagen","applicability_en":"All plants","timing_de":"Erstprüfung","timing_en":"Initial","method_de":"Lockere oder fehlende Klemmen suchen","method_en":"Check missing or loose clamps","evidence_de":"Fotos, Montageprotokoll","evidence_en":"Photos, assembly report","criterion_de":"Alle geprüften Klemmen korrekt und fest","criterion_en":"All sampled clamps secured","qualification":"PV-Fachprüfer / PV inspector","sources":"EPC;OM","flag":"","area":"modules"},{"id":"MOD-008","de":"Kabel unter Modulen","en":"Under-module cable management","applicability_de":"Alle Anlagen","applicability_en":"All plants","timing_de":"Erstprüfung","timing_en":"Initial","method_de":"Keine frei hängenden Leitungen oder Kontakt zu scharfen Kanten","method_en":"Check hanging leads and sharp-edge contact","evidence_de":"Fotostichprobe","evidence_en":"Photo sample","criterion_de":"Kein Scheuer-/Zugrisiko sichtbar","criterion_en":"No observable abrasion or tensile risk","qualification":"PV-Fachprüfer / PV inspector","sources":"EPC;OM","flag":"","area":"modules"},{"id":"MOD-009","de":"Zulässige Modulmontageart","en":"Permitted module mounting configuration","applicability_de":"Alle geklemmten Module","applicability_en":"All clamped modules","timing_de":"Erstprüfung","timing_en":"Initial","method_de":"Einbaulage, Orientierung, Stützabstände und Klemmvariante mit modellspezifischer Anleitung vergleichen.","method_en":"Compare orientation, support spacing and clamp configuration with model-specific manual.","evidence_de":"Montageanleitung mit Revision, Fotos, Ausführungspläne","evidence_en":"Revised installation manual, photographs, as-built drawings","criterion_de":"Konkrete Einbauart/Orientierung nach Montageanleitung und statischem Nachweis freigegeben.","criterion_en":"Actual mounting method/orientation permitted by module manual and structural calculation.","qualification":"PV-Fachprüfer / PV inspector","sources":"OEM;EPC","flag":"","area":"modules"},{"id":"MOD-010","de":"Klemmenlänge und -breite","en":"Clamp length and width","applicability_de":"Alle geklemmten Module","applicability_en":"All clamped modules","timing_de":"Erstprüfung","timing_en":"Initial","method_de":"Abmessungen der verbauten Klemmauflage messen; mit Mindest-/Höchstmaßen laut Modulhersteller vergleichen.","method_en":"Measure contact dimensions of fitted clamps; compare with module OEM dimensions.","evidence_de":"Messfotos, Klemmendatenblatt, Modulmontageanleitung","evidence_en":"Dimensioned photos, clamp datasheet, module installation manual","criterion_de":"Auflageabmessungen erfüllen modellspezifische Herstelleranforderungen.","criterion_en":"Clamp contact dimensions meet model-specific OEM requirements.","qualification":"PV-Fachprüfer / PV inspector","sources":"OEM;EPC","flag":"","area":"modules"},{"id":"MOD-011","de":"Klemmenhöhe und Rahmenkompatibilität","en":"Clamp height and frame compatibility","applicability_de":"Alle geklemmten Module","applicability_en":"All clamped modules","timing_de":"Erstprüfung","timing_en":"Initial","method_de":"Klemmengeometrie mit Modulrahmenhöhe und Klemmen-/Modulfreigabe abgleichen.","method_en":"Check clamp geometry against module frame height and clamp/module approvals.","evidence_de":"Datenblätter, Fotobeleg, Artikelnummern","evidence_en":"Datasheets, photographs, part numbers","criterion_de":"Klemmen passend und für eingesetzte Rahmenhöhe sowie Montageart freigegeben.","criterion_en":"Clamps fit and are approved for the installed frame height and mounting method.","qualification":"PV-Fachprüfer / PV inspector","sources":"OEM;EPC","flag":"","area":"modules"},{"id":"IEA-1-1","de":"Zellrisse / elektrisch isolierte Zellbereiche","en":"Cell cracks / electrically inactive cell areas","applicability_de":"Alle Anlagen","applicability_en":"All plants","timing_de":"Erstprüfung / Bei Verdacht","timing_en":"Initial / If suspected","method_de":"Bei Verdacht EL-Aufnahme veranlassen; sichtbare Schneckenspuren dokumentieren","method_en":"Commission EL imaging if suspected; record visible snail tracks","evidence_de":"EL-Aufnahme mit Modul-ID","evidence_en":"EL image with module ID","criterion_de":"Befund nach elektrischer Auswirkung und Sicherheitsrisiko beurteilt; keine pauschale Riss-Grenze","criterion_en":"Evaluate electrical and safety impact; no universal crack limit","qualification":"PV-Fachprüfer / PV inspector","sources":"PVFS 1-1","flag":"IEA-Empfehlung / IEA guidance","area":"modules"},{"id":"IEA-1-2","de":"Verfärbung von Einbettung oder Rückseitenfolie","en":"Encapsulant/backsheet discolouration","applicability_de":"Alle Anlagen","applicability_en":"All plants","timing_de":"Erstprüfung / Bei Verdacht","timing_en":"Initial / If suspected","method_de":"Front- und Rückseite auf örtliche Vergilbung/Bräunung prüfen","method_en":"Inspect front and rear for local yellowing/browning","evidence_de":"Fotos und betroffene Modulanzahl","evidence_en":"Photos and affected module count","criterion_de":"Auffälligkeiten bewertet; Folgeschäden gesondert prüfen","criterion_en":"Anomalies evaluated; associated damage separately assessed","qualification":"PV-Fachprüfer / PV inspector","sources":"PVFS 1-2","flag":"IEA-Empfehlung / IEA guidance","area":"modules"},{"id":"IEA-1-3","de":"Frontseitige Delamination","en":"Front-side delamination","applicability_de":"Alle Anlagen","applicability_en":"All plants","timing_de":"Erstprüfung / Bei Verdacht","timing_en":"Initial / If suspected","method_de":"Frontglas auf Blasen und Schichtablösung prüfen","method_en":"Inspect front for bubbles and layer separation","evidence_de":"Nahaufnahmen","evidence_en":"Close-up images","criterion_de":"Ausdehnung dokumentiert; kein Hinweis auf exponierte Leiter/Feuchteeintritt","criterion_en":"Extent recorded; no evidence of exposed conductors/moisture paths","qualification":"PV-Fachprüfer / PV inspector","sources":"PVFS 1-3","flag":"IEA-Empfehlung / IEA guidance","area":"modules"},{"id":"IEA-1-4","de":"Rückseitige Delamination","en":"Backsheet delamination","applicability_de":"Alle Anlagen","applicability_en":"All plants","timing_de":"Erstprüfung / Bei Verdacht","timing_en":"Initial / If suspected","method_de":"Rückseite an Kanten und Anschlussdose inspizieren","method_en":"Inspect backsheet edges and junction box area","evidence_de":"Rückseitenfotos","evidence_en":"Rear-side photos","criterion_de":"Keine sicherheitsrelevante Ablösung oder Exposition","criterion_en":"No safety-related separation or exposure","qualification":"PV-Fachprüfer / PV inspector","sources":"PVFS 1-4","flag":"IEA-Empfehlung / IEA guidance","area":"modules"},{"id":"IEA-1-5","de":"Risse der Rückseitenfolie","en":"Backsheet cracking","applicability_de":"Alle Anlagen","applicability_en":"All plants","timing_de":"Erstprüfung / Bei Verdacht","timing_en":"Initial / If suspected","method_de":"Rückseitenfolie auf Risse untersuchen; spannungsfreie Sichtprüfung","method_en":"Inspect backsheet for cracks without touching live parts","evidence_de":"Detailfotos und Modul-ID","evidence_en":"Detail photos and module ID","criterion_de":"Keine freiliegenden Leiter oder Isolationsgefährdung","criterion_en":"No exposed live parts or compromised insulation","qualification":"PV-Fachprüfer / PV inspector","sources":"PVFS 1-5","flag":"IEA-Empfehlung / IEA guidance","area":"modules"},{"id":"IEA-1-6","de":"Kreidung der Rückseitenfolie","en":"Backsheet chalking","applicability_de":"Alle Anlagen","applicability_en":"All plants","timing_de":"Erstprüfung / Bei Verdacht","timing_en":"Initial / If suspected","method_de":"Auf Aufhellung/Kreidung und Materialzerfall prüfen","method_en":"Inspect for whitening/chalking and deterioration","evidence_de":"Fotos und Typangabe","evidence_en":"Photos and module type","criterion_de":"Ausmaß dokumentiert; Werkstoffzustand bei Verdacht weiter prüfen","criterion_en":"Extent recorded; assess material condition if indicated","qualification":"PV-Fachprüfer / PV inspector","sources":"PVFS 1-6","flag":"IEA-Empfehlung / IEA guidance","area":"modules"},{"id":"IEA-1-7","de":"Brand- und Schmorspuren am Modul","en":"Module burn marks","applicability_de":"Alle Anlagen","applicability_en":"All plants","timing_de":"Erstprüfung / Bei Verdacht","timing_en":"Initial / If suspected","method_de":"Front, Rückseite und Anschlussbereiche visuell prüfen","method_en":"Inspect front, rear and junction area visually","evidence_de":"Fotobeleg und Lageplan","evidence_en":"Images and location plan","criterion_de":"Keine Brandspuren; bei Befund Gefährdungsbeurteilung und Sicherung","criterion_en":"No burn marks; if found assess risk and isolate as required","qualification":"PV-Fachprüfer / PV inspector","sources":"PVFS 1-7","flag":"IEA-Empfehlung / IEA guidance","area":"modules"},{"id":"IEA-1-9","de":"Zellverbinder-Schäden","en":"Cell interconnection failure","applicability_de":"Alle Anlagen","applicability_en":"All plants","timing_de":"Erstprüfung / Bei Verdacht","timing_en":"Initial / If suspected","method_de":"Bei auffälligem Temperaturbild gezielt IR/EL prüfen","method_en":"Perform targeted IR/EL where anomalous thermal patterns are present","evidence_de":"IR-/EL-Bilder","evidence_en":"IR/EL images","criterion_de":"Keine bestätigte sicherheitskritische Verbindungsschädigung","criterion_en":"No confirmed safety-critical interconnection defects","qualification":"PV-Fachprüfer / PV inspector","sources":"PVFS 1-9","flag":"IEA-Empfehlung / IEA guidance","area":"modules"},{"id":"IEA-1-10","de":"PID-Verdacht","en":"Suspected potential-induced degradation (PID)","applicability_de":"Alle Anlagen","applicability_en":"All plants","timing_de":"Erstprüfung / Bei Verdacht","timing_en":"Initial / If suspected","method_de":"String-/Modulleistungsbild prüfen; bei Verdacht gezielte Kennlinien/EL","method_en":"Review string/module behaviour; targeted I-V/EL if indicated","evidence_de":"Vergleichsdaten und Prüfprotokoll","evidence_en":"Comparison data and test report","criterion_de":"Abweichungen gegen Referenz und Messunsicherheit fachlich bewertet","criterion_en":"Deviations assessed against reference and measurement uncertainty","qualification":"PV-Fachprüfer / PV inspector","sources":"PVFS 1-10","flag":"IEA-Empfehlung / IEA guidance","area":"modules"},{"id":"IEA-1-11","de":"Korrosion der Zellmetallisierung","en":"Cell metallisation corrosion","applicability_de":"Alle Anlagen","applicability_en":"All plants","timing_de":"Erstprüfung / Bei Verdacht","timing_en":"Initial / If suspected","method_de":"Metallisierungsbahnen auf Korrosion/Verfärbung prüfen","method_en":"Inspect metallisation for corrosion/discolouration","evidence_de":"Detailfotos","evidence_en":"Close-up images","criterion_de":"Keine unbewerteten Korrosions-/Leistungsauswirkungen","criterion_en":"No unassessed corrosion or performance impact","qualification":"PV-Fachprüfer / PV inspector","sources":"PVFS 1-11","flag":"IEA-Empfehlung / IEA guidance","area":"modules"},{"id":"IEA-1-12","de":"Glaskorrosion oder Abrieb","en":"Glass corrosion or abrasion","applicability_de":"Alle Anlagen","applicability_en":"All plants","timing_de":"Erstprüfung / Bei Verdacht","timing_en":"Initial / If suspected","method_de":"Glasoberfläche in repräsentativen Bereichen inspizieren","method_en":"Inspect glass surface in representative areas","evidence_de":"Fotos, betroffenes Feld","evidence_en":"Photos, affected area","criterion_de":"Beeinträchtigung und mögliche Ursache dokumentiert","criterion_en":"Impact and possible cause recorded","qualification":"PV-Fachprüfer / PV inspector","sources":"PVFS 1-12","flag":"IEA-Empfehlung / IEA guidance","area":"modules"},{"id":"IEA-1-13","de":"Gelöste/defekte Modulanschlussdose","en":"Detached or defective module junction box","applicability_de":"Alle Anlagen","applicability_en":"All plants","timing_de":"Erstprüfung / Bei Verdacht","timing_en":"Initial / If suspected","method_de":"Anschlussdose sichtprüfen; nicht am Kabel ziehen","method_en":"Visually inspect junction box; do not pull cables","evidence_de":"Modul-ID und Fotos","evidence_en":"Module ID and images","criterion_de":"Dose sitzt sicher, keine Risse oder Feuchtespuren","criterion_en":"Box secure with no cracks or moisture evidence","qualification":"PV-Fachprüfer / PV inspector","sources":"PVFS 1-13","flag":"IEA-Empfehlung / IEA guidance","area":"modules"},{"id":"IEA-1-14","de":"Anschlussfehler in Modulanschlussdose","en":"Junction-box interconnection failure","applicability_de":"Alle Anlagen","applicability_en":"All plants","timing_de":"Erstprüfung / Bei Verdacht","timing_en":"Initial / If suspected","method_de":"Bei IR-Auffälligkeit/Fehlerbild fachkundig nachprüfen","method_en":"Qualified follow-up of thermal anomalies/fault indications","evidence_de":"Thermografie/Serviceprotokoll","evidence_en":"Thermography/service record","criterion_de":"Kein bestätigter kritischer Kontaktfehler","criterion_en":"No confirmed critical contact fault","qualification":"PV-Fachprüfer / PV inspector","sources":"PVFS 1-14","flag":"IEA-Empfehlung / IEA guidance","area":"modules"},{"id":"IEA-1-15","de":"Bypassdiodenfunktion bei Verdacht","en":"Bypass diode function when suspected","applicability_de":"Alle Anlagen","applicability_en":"All plants","timing_de":"Erstprüfung / Bei Verdacht","timing_en":"Initial / If suspected","method_de":"Bei Teilstring-Ausfall gezielten Diodentest veranlassen","method_en":"Order targeted bypass-diode test if substring failure suspected","evidence_de":"Diodenprüfprotokoll","evidence_en":"Diode test report","criterion_de":"Betriebszustand gemäß Hersteller-/Testverfahren plausibel","criterion_en":"Function plausible under OEM/test procedure","qualification":"PV-Fachprüfer / PV inspector","sources":"PVFS 1-15","flag":"IEA-Empfehlung / IEA guidance","area":"modules"},{"id":"IEA-1-16","de":"Modulleistung bei Verdacht auf Unterleistung","en":"Suspected module power under-rating","applicability_de":"Alle Anlagen","applicability_en":"All plants","timing_de":"Erstprüfung / Bei Verdacht","timing_en":"Initial / If suspected","method_de":"Kennlinien nur bei geeigneter Einstrahlung/Temperatur und Korrektur messen","method_en":"Measure I-V only under suitable irradiance/temperature and correct results","evidence_de":"I-V-Daten, Kalibriernachweise","evidence_en":"I-V data and calibration records","criterion_de":"Gegen Leistungsreferenz inklusive Unsicherheit bewertet","criterion_en":"Assessed against power reference incl. uncertainty","qualification":"PV-Fachprüfer / PV inspector","sources":"PVFS 1-16","flag":"IEA-Empfehlung / IEA guidance","area":"modules"},{"id":"IEA-1-18","de":"Modulbedingter Isolationsfehler","en":"Module-related insulation failure","applicability_de":"Alle Anlagen","applicability_en":"All plants","timing_de":"Erstprüfung / Bei Verdacht","timing_en":"Initial / If suspected","method_de":"Bei Isolationsalarm fachkundige Fehlerortung nach sicherer Trennung","method_en":"Qualified fault locating following alarm and safe isolation","evidence_de":"Messprotokoll, betroffene Stränge","evidence_en":"Test report and affected strings","criterion_de":"Messwert erfüllt projektspezifisch anwendbare Prüfvorgaben","criterion_en":"Measurement meets applicable project-specific test rules","qualification":"PV-Fachprüfer / PV inspector","sources":"PVFS 1-18","flag":"IEA-Empfehlung / IEA guidance","area":"modules"},{"id":"IEA-1-19","de":"Modul-Hotspots","en":"Module hot spots","applicability_de":"Alle Anlagen","applicability_en":"All plants","timing_de":"Erstprüfung / Bei Verdacht","timing_en":"Initial / If suspected","method_de":"Thermografie bei ausreichender stabiler Einstrahlung und geringer Verschattung","method_en":"Perform thermography in adequate stable irradiance, avoiding shade","evidence_de":"IR-Bilder, Einstrahlung und Temperatur","evidence_en":"IR images, irradiance and temperature","criterion_de":"Auffällige Temperaturmuster dokumentiert und Ursachen bewertet","criterion_en":"Anomalous thermal patterns recorded and evaluated","qualification":"PV-Fachprüfer / PV inspector","sources":"PVFS 1-19","flag":"IEA-Empfehlung / IEA guidance","area":"modules"},{"id":"IEA-1-20","de":"Lokale starke Verschmutzung","en":"Localised severe soiling","applicability_de":"Alle Anlagen","applicability_en":"All plants","timing_de":"Erstprüfung / Bei Verdacht","timing_en":"Initial / If suspected","method_de":"Lokale Ablagerungen und Vogelkot kartieren","method_en":"Map deposits and bird droppings","evidence_de":"Fotos, Modulstandort","evidence_en":"Images and module location","criterion_de":"Verschmutzung klassifiziert, Ertrags-/Hotspotrisiko beurteilt","criterion_en":"Soiling classified; yield/hotspot risk assessed","qualification":"PV-Fachprüfer / PV inspector","sources":"PVFS 1-20","flag":"IEA-Empfehlung / IEA guidance","area":"modules"},{"id":"MOD-012","de":"Verschattung der Module durch Pflanzenbewuchs","en":"Module shading from vegetation","applicability_de":"Freiflächen- und vegetationsgefährdete Anlagen","applicability_en":"Ground-mounted and vegetation-exposed arrays","timing_de":"Erstprüfung; saisonal wiederholen","timing_en":"Initial; repeat seasonally","method_de":"Bewuchs vor/unter Modulreihen und an Feldrändern visuell prüfen; betroffene Module/Reihen, Tageszeit und Verschattungsbereich dokumentieren.","method_en":"Inspect vegetation in front of/below module rows and at array edges; document affected modules/rows, time of day and shaded area.","evidence_de":"Fotos mit Reihen-/Modul-ID, Pflegeplan, ggf. Schattenanalyse","evidence_en":"Photos with row/module ID, vegetation management plan, shading analysis if required","criterion_de":"Pflanzenbedingte Verschattung innerhalb der projektspezifisch zulässigen Grenzen; Maßnahmen zur Vegetationspflege sind festgelegt.","criterion_en":"Vegetation shading within project-specific permitted limits; vegetation-control actions defined.","qualification":"PV-Fachprüfer / PV inspector","sources":"PVFS 3-3; OM","flag":"Bewertung nach Sonnenstand/Jahreszeit; nicht mit Modulverschmutzung gleichsetzen / Assess season and solar position; distinct from soiling","area":"modules"},{"id":"MNT-001","de":"Stützen und Träger","en":"Posts and beams","applicability_de":"Bei entsprechender Bauart","applicability_en":"Where applicable","timing_de":"Erstprüfung","timing_en":"Initial","method_de":"Auf Risse, Verzug und Beschädigung prüfen","method_en":"Inspect cracks, deformation and damage","evidence_de":"Fotoprotokoll","evidence_en":"Photos","criterion_de":"Keine :"PERMIT;EPC","flag":"","area":"mount"},{"id":"MNT-005","de":"Drainage am Gestell","en":"Drainage around supports","applicability_de":"Bei entsprechender Bauart","applicability_en":"Where applicable","timing_de":"Erstprüfung","timing_en":"Initial","method_de":"Staunässe und Erosionsspuren prüfen","method_en":"Inspect standing water and erosion","evidence_de":"Drainageplan, Fotos","evidence_en":"Drainage plan, photos","criterion_de":"Entwässerung nach freigegebenem Konzept","criterion_en":"Drainage as designed","qualification":"Tragwerksprüfer / Structural inspector","sources":"PERMIT;EPC","flag":"","area":"mount"},{"id":"MNT-006","de":"Dachdurchdringungen","en":"Roof penetrations","applicability_de":"Bei entsprechender Bauart","applicability_en":"Where applicable","timing_de":"Erstprüfung","timing_en":"Initial","method_de":"Anschlüsse und Abdichtung visuell prüfen","method_en":"Visually check roof penetrations and sealing","evidence_de":"Dachdetail, Fotos","evidence_en":"Roof detail, photos","criterion_de":"Keine offenen Fehlstellen oder Leckageanzeichen","criterion_en":"No visible failed seals or leaks","qualification":"Tragwerksprüfer / Structural inspector","sources":"PERMIT;EPC","flag":"","area":"mount"},{"id":"MNT-007","de":"Dachlasten","en":"Roof loading","applicability_de":"Bei entsprechender Bauart","applicability_en":"Where applicable","timing_de":"Erstprüfung","timing_en":"Initial","method_de":"Gewichts-/Ballastplan mit Ist-Aufstellung vergleichen","method_en":"Compare installed ballast with design","evidence_de":"Statik, Ballastliste","evidence_en":"Structural proof, ballast list","criterion_de":"Konformität mit freigegebenem Lastnachweis","criterion_en":"Conforms to approved loading assessment","qualification":"Tragwerksprüfer / Structural inspector","sources":"PERMIT;EPC","flag":"","area":"mount"},{"id":"MNT-008","de":"Tracker-Funktion","en":"Tracker function","applicability_de":"Bei entsprechender Bauart","applicability_en":"Where applicable","timing_de":"Erstprüfung","timing_en":"Initial","method_de":"Verfahrprobe nach Herstellerverfahren","method_en":"Observe tracker operation to OEM procedure","evidence_de":"Steuerungsprotokoll","evidence_en":"Controller log","criterion_de":"Bewegung, Endlagen und Schutzreaktionen plausibel","criterion_en":"Movement, end positions and protections reasonable","qualification":"Tragwerksprüfer / Structural inspector","sources":"PERMIT;EPC","flag":"","area":"mount"},{"id":"MNT-009","de":"Kontaktkorrosion an Mischmetallverbindungen","en":"Galvanic corrosion at dissimilar-metal joints","applicability_de":"Verbindungen unterschiedlicher Metalle","applicability_en":"Connections between dissimilar metals","timing_de":"Erstprüfung","timing_en":"Initial","method_de":"Al/Cu/Stahl/Edelstahl-Kontaktpunkte, Trennlagen, Beschichtungen und Feuchteexposition anhand Planung und vor Ort prüfen.","method_en":"Check Al/Cu/steel/stainless contacts, barriers/coatings and moisture exposure against design and field conditions.","evidence_de":"Materialliste, Detailzeichnung, Herstellerfreigabe, Fotos","evidence_en":"Material schedule, detail drawing, OEM approval, photos","criterion_de":"Kontaktpaarung / Schutzmaßnahmen für die konkrete Umgebungsbeanspruchung freigegeben; keine unbewerteten korrosionsgefährdeten Kontaktstellen.","criterion_en":"Metal pairing/protection approved for actual exposure; no unassessed galvanic-corrosion interfaces.","qualification":"Tragwerksprüfer / Structural inspector","sources":"EPC;OEM","flag":"Projektbezogene Werkstoff- und Expositionsprüfung / Project-specific material and exposure assessment","area":"mount"},{"id":"IEA-3-2","de":"Strukturelle Verformung und Befestigungsversagen","en":"Structural deformation and attachment failure","applicability_de":"Alle Anlagen","applicability_en":"All plants","timing_de":"Erstprüfung / Bei Verdacht","timing_en":"Initial / If suspected","method_de":"Tragglieder und Verbindungspunkte auf Biegung/Risse prüfen","method_en":"Inspect rails and connections for deformation/fracture","evidence_de":"Fotos und Statik/As-built","evidence_en":"Photos and structural as-built","criterion_de":"Keine Verformung außerhalb freigegebener Toleranzen","criterion_en":"No deformation outside approved tolerances","qualification":"PV-Fachprüfer / PV inspector","sources":"PVFS 3-2","flag":"IEA-Empfehlung / IEA guidance","area":"mount"},{"id":"DC-001","de":"DC-Kabelisolierung visuell","en":"DC cable insulation visual condition","applicability_de":"Alle Anlagen","applicability_en":"All plants","timing_de":"Erstprüfung","timing_en":"Initial","method_de":"Begehung entlang zugänglicher Trassen","method_en":"Inspect accessible cable routes","evidence_de":"Fotos, Kabelplan","evidence_en":"Photos, cable plan","criterion_de":"Keine Schnitte, offene Isolation oder Scheuerstellen","criterion_en":"No cuts, exposed insulation or abrasion","qualification":"Elektrofachkraft / Qualified electrician","sources":"712;62446","flag":"","area":"dc"},{"id":"DC-002","de":"DC-Kabelfixierung: mechanischer Halt","en":"DC cable restraint: mechanical security","applicability_de":"Alle Anlagen","applicability_en":"All plants","timing_de":"Erstprüfung","timing_en":"Initial","method_de":"Befestigungspunkte, Schellen/Kabelbinder, Durchhang, Zugentlastung und Befestigungsabstände stichprobenartig prüfen; UV-/Witterungseignung der Halterungen separat anhand Datenblatt nachweisen.","method_en":"Sample cable fixings, clips/ties, sag, strain relief and support spacing; confirm outdoor/UV suitability of supports from datasheets.","evidence_de":"Trassen-/Detailfotos, Befestigungsdatenblatt, Vorgaben zur Verlegung","evidence_en":"Cable-route/detail photos, fixing datasheets, installation requirements","criterion_de":"Keine losen/hängenden oder zugbeanspruchten DC-Leitungen; Fixierung entsprechend Hersteller- und Ausführungsanforderungen.","criterion_en":"No loose, hanging or strained DC cables; restraint complies with OEM and as-built routing requirements.","qualification":"Elektrofachkraft / Qualified electrician","sources":"712;62446","flag":"","area":"dc"},{"id":"DC-003","de":"UV-Eignung","en":"UV suitability","applicability_de":"Alle Anlagen","applicability_en":"All plants","timing_de":"Erstprüfung","timing_en":"Initial","method_de":"Kabeltypen und Exposition abgleichen","method_en":"Check cable ratings against exposure","evidence_de":"Kabeldatenblatt","evidence_en":"Cable datasheet","criterion_de":"Freigegebener Typ für Einbauort","criterion_en":"Cable suitable for installed environment","qualification":"Elektrofachkraft / Qualified electrician","sources":"712;62446","flag":"","area":"dc"},{"id":"DC-004","de":"DC-Steckverbinder: Hersteller-/Typkompatibilität","en":"DC connectors: manufacturer/type mating compatibility","applicability_de":"Alle Anlagen","applicability_en":"All plants","timing_de":"Erstprüfung","timing_en":"Initial","method_de":"Kennzeichnung beider Steckverbinderhälften je Stichprobe ablesen; Hersteller-/Typfreigabe der konkreten Paarung prüfen; kein Schluss aus MC4-ähnlicher Bauform.","method_en":"Read manufacturer/type markings on both mating halves of each sampled pair; check explicit compatibility approval; MC4-like geometry alone is insufficient.","evidence_de":"Steckverbinderliste, Fotos der beiden Hälften, Herstellerfreigabe / Montageanleitungen","evidence_en":"Connector schedule, photos of both halves, manufacturer approval / manuals","criterion_de":"Jede geprüfte Paarung durch Herstellerfreigabe oder eindeutigen Nachweis der zulässigen Kombination gedeckt; bei fehlendem Nachweis Befund offen bzw. nicht bestanden.","criterion_en":"Each inspected pair supported by explicit manufacturer approval or documented permitted combination; missing approval is an unresolved/failed finding.","qualification":"Elektrofachkraft / Qualified electrician","sources":"63225;712;EPC","flag":"DIN IEC/TR 63225:2021-12 = technischer Bericht; Detailtext nicht eingesehen / technical report; full text not reviewed","area":"dc"},{"id":"DC-005","de":"DC-Steckverbinder: sichtbarer Zustand und Verriegelung","en":"DC connectors: visible condition and locking","applicability_de":"Alle Anlagen","applicability_en":"All plants","timing_de":"Erstprüfung","timing_en":"Initial","method_de":"Steckverbinder stichprobenartig auf vollständiges Einrasten/Verriegelung, Gehäuse- und Dichtungsschäden, thermische Verfärbungen sowie Zugbeanspruchung visuell kontrollieren; nicht unter Last trennen.","method_en":"Visually sample proper engagement/locking, enclosure/seal damage, thermal discoloration and cable strain; never disconnect under load.","evidence_de":"Steckverbinder-ID, Fotos, Hersteller-Montageanleitung","evidence_en":"Connector ID, photos, OEM assembly instructions","criterion_de":"Keine losen, unvollständig verriegelten oder beschädigten Verbindungen; Zustand nach Herstelleranforderung.","criterion_en":"No loose, incompletely engaged or damaged connectors; condition meets OEM instructions.","qualification":"Elektrofachkraft / Qualified electrician","sources":"712;62446","flag":"","area":"dc"},{"id":"DC-006","de":"GAK-Gehäuse","en":"Combiner-box enclosure","applicability_de":"Alle Anlagen","applicability_en":"All plants","timing_de":"Erstprüfung","timing_en":"Initial","method_de":"Gehäuse, Verschlüsse und Dichtungen prüfen","method_en":"Inspect enclosure, seals and latches","evidence_de":"Foto, IP-Datenblatt","evidence_en":"Photos, IP rating","criterion_de":"Gehäuse passend und dicht","criterion_en":"Enclosure suitable and intact","qualification":"Elektrofachkraft / Qualified electrician","sources":"712;62446","flag":"","area":"dc"},{"id":"DC-007","de":"GAK-Beschriftung: Identifikation und Stromkreiszuordnung","en":"Combiner-box labelling: identification and circuit assignment","applicability_de":"Alle Anlagen","applicability_en":"All plants","timing_de":"Erstprüfung","timing_en":"Initial","method_de":"Vor Ort GAK-ID, Strang-/Sicherungskennzeichnungen und Warnhinweise mit Stromlaufplan abgleichen","method_en":"Compare GAK ID, string/fuse labels and warnings with as-built single-line drawing","evidence_de":"Fotos aller relevanten Beschriftungen; Stromlaufplan","evidence_en":"Photos of labels; as-built electrical drawing","criterion_de":"Lesbar, dauerhaft, korrekt und eindeutig den Stromkreisen zugeordnet","criterion_en":"Legible, durable, accurate and unambiguously mapped to circuits","qualification":"Elektrofachkraft / Qualified electrician","sources":"712;62446","flag":"","area":"dc"},{"id":"DC-008","de":"String-Sicherungen","en":"String fuse ratings","applicability_de":"Alle Anlagen","applicability_en":"All plants","timing_de":"Erstprüfung","timing_en":"Initial","method_de":"Sicherungstyp und Bemessung nach Plan abgleichen","method_en":"Check fuse type and rating vs design","evidence_de":"Schutzkonzept, Sicherungsliste","evidence_en":"Protection design, fuse schedule","criterion_de":"Entspricht freigegebenem Schutzkonzept","criterion_en":"Matches approved protection design","qualification":"Elektrofachkraft / Qualified electrician","sources":"712;62446","flag":"","area":"dc"},{"id":"DC-009","de":"DC-Trennschalter","en":"DC isolation devices","applicability_de":"Alle Anlagen","applicability_en":"All plants","timing_de":"Erstprüfung","timing_en":"Initial","method_de":"Typ, Kennzeichnung und Zugänglichkeit prüfen","method_en":"Check model, labels and access","evidence_de":"SLD, Typenschild","evidence_en":"SLD, device rating","criterion_de":"Für Anwendung geeignet und zugänglich","criterion_en":"Suitable for application and accessible","qualification":"Elektrofachkraft / Qualified electrician","sources":"712;62446","flag":"","area":"dc"},{"id":"DC-010","de":"DC-Überspannungsschutz","en":"DC surge protective devices","applicability_de":"Alle Anlagen","applicability_en":"All plants","timing_de":"Erstprüfung","timing_en":"Initial","method_de":"Statusanzeigen und Dimensionierung dokumentieren","method_en":"Record SPD status and design selection","evidence_d ns/OEM limits without damage or excessive loading.","qualification":"Elektrofachkraft / Qualified electrician","sources":"EPC;OEM","flag":"","area":"ac"},{"id":"AC-015","de":"SPD-Fernmeldekontakt / Meldekontakt AC","en":"AC SPD remote signalling / status contact","applicability_de":"Falls laut Projekt, Vertrag, Monitoring-/Alarmkonzept oder Hersteller erforderlich","applicability_en":"Where required by project, contract, monitoring/alarm concept or manufacturer","timing_de":"Erstprüfung; Funktionsprüfung nur sicher/abgestimmt","timing_en":"Initial; functional test only where safe/coordinated","method_de":"Vorhandensein, Verdrahtung und Statusübertragung zur Meldetechnik prüfen; sichere Funktionsprüfung nur nach freigegebener Prüfanweisung.","method_en":"Check presence, wiring and alarm/status transmission; test only using an approved safe procedure.","evidence_de":"SPD-Datenblatt, Schaltplan, I/O-Liste, Alarmtestprotokoll, SCADA-Screenshot","evidence_en":"SPD datasheet, wiring drawing, I/O list, alarm test record, SCADA screenshot","criterion_de":"Bei geforderter Fernmeldung: Kontakt vorhanden, verdrahtet und Störmeldung nachgewiesen. Ohne Anforderung als nicht anwendbar dokumentieren.","criterion_en":"Where remote indication is required: contact installed, wired and alarm demonstrated. Otherwise record not applicable.","qualification":"Elektrofachkraft / Qualified electrician","sources":"DESIGN;O&M;OEM","flag":"Fehlender Meldekontakt ist nicht automatisch normwidrig; projektspezifische Monitoring-/Alarmanforderung beachten.","area":"ac"},{"id":"TR-001","de":"Trafo-Typ und Bemessung","en":"Transformer model and rating","applicability_de":"Bei vorhandenem Transformator","applicability_en":"If transformer installed","timing_de":"Erstprüfung","timing_en":"Initial","method_de":"Typenschild und Netz-/Anlagenplanung abgleichen","method_en":"Check nameplate with design","evidence_de":"Trafo-Datenblatt","evidence_en":"Transformer datasheet","criterion_de":"Bemessung gemäß freigegebenem Design","criterion_en":"Rating matches approved design","qualification":"MS-Elektrofachkraft / MV qualified electrician","sources":"FNN4110;PERMIT;EPC","flag":"","area":"trafo","condition":"trafo","variants":["inside","outside"]},{"id":"TR-002","de":"Transformator: standsichere Aufstellung","en":"Transformer: stable installation","applicability_de":"Bei vorhandenem Transformator","applicability_en":"If transformer installed","timing_de":"Erstprüfung","timing_en":"Initial","method_de":"Fundament/Sockel und Befestigung nach Hersteller-/Projektunterlagen sichtprüfen.","method_en":"Visually check foundation/base and anchoring against OEM and project drawings.","evidence_de":"Bauplan, Fotos","evidence_en":"Civil drawing, photos","criterion_de":"Aufstellung und mechanische Standsicherheit gemäß Projektunterlagen.","criterion_en":"Installation and mechanical stability follow project design.","qualification":"MS-Elektrofachkraft / MV qualified electrician","sources":"FNN4110;PERMIT;EPC","flag":"","area":"trafo","condition":"trafo","variants":["inside","outside"]},{"id":"TR-003","de":"Trafo: Ölverlust / sichtbare Leckage","en":"Transformer: oil loss / visible leakage","applicability_de":"Bei vorhandenem Transformator","applicability_en":"If transformer installed","timing_de":"Erstprüfung","timing_en":"Initial","method_de":"Ölbehälter, Dichtungen und Anschlüsse visuell auf Tropfenbildung, Ölspuren oder Austritt prüfen; Auffangeinrichtung separat nach Dokumentation bewerten.","method_en":"Visually inspect tank, gaskets and connections for drips, oil traces or leaks; assess containment separately against design.","evidence_de":"Fotos, Wartungsprotokoll, ggf. Ölstand-/Leckagebericht","evidence_en":"Photos, maintenance log, oil-level/leak report if available","criterion_de":"Kein unzulässiger Ölaustritt; etwaiger Verlust und Ursache dokumentiert, Maßnahmen eingeleitet.","criterion_en":"No unacceptable oil release; any loss and cause recorded and addressed.","qualification":"MS-Elektrofachkraft / MV qualified electrician","sources":"FNN4110;PERMIT;EPC","flag":"","area":"trafo","condition":"trafo","variants":["inside","outside"]},{"id":"TR-004","de":"Kühlung/Lüftung","en":"Cooling and ventilation","applicability_de":"Bei vorhandenem Transformator","applicability_en":"If transformer installed","timing_de":"Erstprüfung","timing_en":"Initial","method_de":"Lüftungsöffnungen und Temperaturen prüfen","method_en":"Check vents and temperatures","evidence_de":"OEM-Angaben, Betriebsdaten","evidence_en":"OEM guidance, operation data","criterion_de":"Betrieb im Auslegungsbereich","criterion_en":"Within design operating envelope","qualification":"MS-Elektrofachkraft / MV qualified electrician","sources":"FNN4110;PERMIT;EPC","flag":"","area":"trafo","condition":"trafo","variants":["inside","outside"]},{"id":"TR-005","de":"Schutzrelais/Fernmeldung","en":"Transformer protection and alarms","applicability_de":"Bei vorhandenem Transformator","applicability_en":"If transformer installed","timing_de":"Erstprüfung","timing_en":"Initial","method_de":"Schutzeinstellungen und Meldungswege kontrollieren","method_en":"Review relay settings and alarm paths","evidence_de":"Schutzplan, Prüfbericht","evidence_en":"Protection study, test report","criterion_de":"Funktionsnachweis gemäß Schutzkonzept","criterion_en":"Function proven to protection scheme","qualification":"MS-Elektrofachkraft / MV qualified electrician","sources":"FNN4110;PERMIT;EPC","flag":"Sicherheitskritisch / Safety-critical","area":"trafo","condition":"trafo","variants":["inside","outside"]},{"id":"TR-006","de":"Erdung Trafo-/MS-Anlage","en":"Transformer/MV earthing","applicability_de":"Bei vorhandenem Transformator","applicability_en":"If transformer installed","timing_de":"Erstprüfung","timing_en":"Initial","method_de":"Erdungsverbindungen und Prüfberichte abgleichen","method_en":"Check bonds and test reports","evidence_de":"Erdungsgutachten","evidence_en":"Earthing assessment","criterion_de":"Nachweis gemäß Standorterdungskonzept","criterion_en":"Evidence conforms to site earthing design","qualification":"MS-Elektrofachkraft / MV qualified electrician","sources":"FNN4110;PERMIT;EPC","flag":"Sicherheitskritisch / Safety-critical","area":"trafo","condition":"trafo","variants":["inside","outside"]},{"id":"TR-007","de":"Trafo-Inbetriebnahmeprüfungen","en":"Transformer commissioning tests","applicability_de":"Bei vorhandenem Transformator","applicability_en":"If transformer installed","timing_de":"Erstprüfung","timing_en":"Initial","method_de":"Vorhandene dielektrische und elektrische Werks-/Vor-Ort-Prüfungen prüfen","method_en":"Review applicable factory/site electrical test reports","evidence_de":"FAT/SAT, Prüfzeugnisse","evidence_en":"FAT/SAT, certificates","criterion_de":"Geforderter Prüfumfang vollständig und bestanden","criterion_en":"Required scope complete and passed","qualification":"MS-Elektrofachkraft / MV qualified electrician","sources":"FNN4110;PERMIT;EPC","flag":"","area":"trafo","condition":"trafo","variants":["inside","outside"]},{"id":"TRF-007","de":"Cu-/Al-Übergänge an Transformatoranschlüssen","en":"Cu/Al transition joints at transformer terminals","applicability_de":"Transformatoren mit Mischmetallanschlüssen","applicability_en":"Transformers with mixed-metal terminations","timing_de":"Erstprüfung","timing_en":"Initial","method_de":"Kabelschuhe, Anschlussfahnen und Übergangsteile sowie Kontaktschutz prüfen.","method_en":"Check lugs, connection palms, transition fittings and joint protection.","evidence_de":"Trafoanleitung, Materialnachweis, Fotos, Anschlussprotokoll","evidence_en":"Transformer manual, material verification, photos, termination record","criterion_de":"Verbindung und Schutzmaßnahmen für Materialpaarung und Umgebung vom Hersteller freigegeben.","criterion_en":"Connection and protective measures approved for metal pairing and exposure.","qualification":"Elektrofachkraft / Qualified electrician","sources":"OEM;EPC","flag":"","area":"trafo","condition":"trafo","variants":["inside","outside"]},{"id":"TR-010","de":"Trafo-Anschlüsse: Kabel-/Klemmenabdeckungen","en":"Transformer terminals: cable/terminal covers","applicability_de":"Transformatoren mit zugänglichen Anschlussabdeckungen","applicability_en":"Transformers with accessible terminal covers","timing_de":"Erstprüfung","timing_en":"Initial","method_de":"Sichtprüfung der Berührschutz-/Anschlussabdeckungen auf Vollständigkeit, festen Sitz und Beschädigung; kein Öffnen unter Spannung.","method_en":"Visually verify terminal/touch-protection covers are complete, secure and undamaged; do not open while energised.","evidence_de":"Fotos, Herstellerzeichnung, Stationsplan","evidence_en":"Photos, OEM drawing, station plan","criterion_de":"Berührschutz und Abdeckung wie freigegeben vorhanden; keine frei zugänglichen aktiven Teile.","criterion_en":"Approved protective covers present; no accessible live parts.","qualification":"MS-Elektrofachkraft / MV qualified electrician","sources":"OEM;EPC","flag":"Sicherheitskritisch / Safety-critical","area":"trafo","condition":"trafo","variants":["inside","outside"]},{"id":"TR-011","de":"Trafo-Station: elektrische Warnschilder","en":"Transformer station: electrical warning signs","applicability_de":"Alle Trafo-/MS-Stationen","applicability_en":"All transformer/MV stations","timing_de":"Erstprüfung","timing_en":"Initial","method_de":"Warnschilder an Zutritten und relevanten Gefahrenstellen auf Vorhandensein, Lesbarkeit und Zustand prüfen.","method_en":"Check warning signs at entrances and relevant hazards for presence, legibility and condition.","evidence_de":"Fotos, Kennzeichnungsplan, Gefährdungsbeurteilung","evidence_en":"Photos, signage plan, risk assessment","criterion_de":"Geforderte Gefahrenkennzeichnung gemäß Standort-/Sicherheitskonzept sichtbar und dauerhaft.","criterion_en":"Required hazard signs visible and durable per site safety/signage plan.","qualification":"MS-Elektrofachkraft / MV qualified electrician","sources":"HSE;PERMIT;EPC","flag":"","area":"trafo","condition":"trafo","variants":["inside","outside"]},{"id":"TR-IN-001","de":"Traforaum: Feuchtigkeit und Wasser im Unterboden","en":"Transformer room: moisture and water below floor","applicability_de":"Innenaufstellung mit Unterboden","applicability_en":"Indoor with subfloor","timing_de":"Erstprüfung / periodisch","timing_en":"Initial / periodic","method_de":"Unterboden/Kabelkeller ohne Eingriff in gefährdete Bereiche sichtprüfen.","method_en":"Visually inspect accessible subfloor/cable cellar without unsafe entry.","evidence_de":"Fotos, Wartungsbericht","evidence_en":"Photos, maintenance report","criterion_de":"Kein unzulässiger Wassereintritt oder stehendes Wasser.","criterion_en":"No unacceptable ingress or standing water.","qualification":"Elektrofachkraft / Qualified electrician","sources":"","flag":"","area":"trafo","condition":"trafo","variants":["inside"]},{"id":"TR-IN-002","de":"Traforaum: allgemeiner baulicher Zustand","en":"Transformer room: general building condition","applicability_de":"Innenaufstellung","applicability_en":"Indoor installation","timing_de":"Erstprüfung / periodisch","timing_en":"Initial / periodic","method_de":"Boden, Wände, Dach, Türen, Beleuchtung und Sauberkeit sichtprüfen.","method_en":"Visually inspect floor, walls, roof, doors, lighting and cleanliness.","evidence_de":"Fotos, Stationsdokumentation","evidence_en":"Photos, station documents","criterion_de":"Zustand gemäß Stationskonzept; keine sicherheitsrelevanten Schäden.","criterion_en":"Matches station design; no safety-relevant damage.","qualification":"Elektrofachkraft / Qualified electrician","sources":"","flag":"","area":"trafo","condition":"trafo","variants":["inside"]},{"id":"TR-IN-003","de":"Traforaum: Lüftungsöffnungen frei","en":"Transformer room: ventilation openings clear","applicability_de":"Innenaufstellung","applicability_en":"Indoor installation","timing_de":"Erstprüfung / periodisch","timing_en":"Initial / periodic","method_de":"Lüftungsschlitze, Filter und Luftwege kontrollieren.","method_en":"Inspect ventilation grilles, filters and airflow paths.","evidence_de":"Fotos, Lüftungskonzept","evidence_en":"Photos, ventilation design","criterion_de":"Lüftung gemäß Hersteller/Plan gewährleistet.","criterion_en":"Ventilation complies with OEM/design.","qualification":"Elektrofachkraft / Qualified electrician","sources":"","flag":"","area":"trafo","condition":"trafo","variants":["inside"]},{"id":"TR-IN-004","de":"Traforaum: Zugang und Türverschluss","en":"Transformer room: access and door locks","applicability_de":"Innenaufstellung","applicability_en":"Indoor installation","timing_de":"Erstprüfung / periodisch","timing_en":"Initial / periodic","method_de":"Türzustand, Schließung, Zutrittsregelung und Zugang prüfen.","method_en":"Check door condition, locks, access control and clearance.","evidence_de":"Fotos, Zugangskonzept","evidence_en":"Photos, access plan","criterion_de":"Gesicherter Zugang für autorisiertes Personal.","criterion_en":"Controlled access for authorized personnel.","qualification":"Elektrofachkraft / Qualified electrician","sources":"","flag":"","area":"trafo","condition":"trafo","variants":["inside"]},{"id":"TR-IN-005","de":"Traforaum: Feuerlöscher bereitgestellt und geprüft","en":"Transformer room: extinguisher provision and inspection","applicability_de":"Sofern durch Brandschutzkonzept vorgesehen","applicability_en":"Where required by fire plan","timing_de":"Erstprüfung / periodisch","timing_en":"Initial / periodic","method_de":"Standort, Zugang und Prüfplakette prüfen.","method_en":"Check location, access and inspection tag.","evidence_de":"Brandschutzkonzept, Fotos","evidence_en":"Fire plan, photos","criterion_de":"Konzeptgemäße Bereitstellung und gültige Prüfung.","criterion_en":"Required provision and current inspection.","qualification":"Elektrofachkraft / Qualified electrician","sources":"","flag":"","area":"trafo","condition":"trafo","variants":["inside"]},{"id":"TR-008","de":"Außen-Trafo: Schutzblock-/Schutzabdeckung","en":"Outdoor transformer: protective block/cover","applicability_de":"Außenaufstellung mit Schutzblock oder Abdeckung","applicability_en":"Outdoor units with protective block or cover","timing_de":"Erstprüfung","timing_en":"Initial","method_de":"Vorhandensein, Befestigung, Beschädigungen und Zugänglichkeit der projektierten Schutzabdeckung visuell prüfen.","method_en":"Visually inspect presence, fixation, damage and access to specified protective cover.","evidence_de":"Fotos, Trafo-Aufstellplan, Herstellerzeichnung","evidence_en":"Photos, transformer layout, OEM drawing","criterion_de":"Vorgesehene Abdeckung vollständig, standsicher und gemäß Bauart/Herstelleranweisung montiert.","criterion_en":"Specified cover complete, secure and installed to design/OEM instructions.","qualification":"MS-Elektrofachkraft / MV qualified electrician","sources":"OEM;EPC","flag":"Sicherheitskritisch bei offenem Berührschutz / Safety-critical if touch protection absent","area":"trafo","condition":"trafo","variants":["outside"]},{"id":"TR-009","de":"Trafo-Station: Bewuchs und Vegetationsfreihaltung","en":"Transformer station: vegetation encroachment","applicability_de":"Außen-Trafostationen","applicability_en":"Outdoor transformer stations","timing_de":"Erstprüfung","timing_en":"Initial","method_de":"Bewuchs an Lüftung, Zugängen, Einfriedung und elektrischen Anlagen prüfen.","method_en":"Inspect vegetation at vents, access routes, fencing and electrical equipment.","evidence_de":"Standortfotos, Vegetationspflegeplan","evidence_en":"Site photos, vegetation management plan","criterion_de":"Freihaltezonen entsprechen Standort-/Herstellervorgaben; Zugänge und Kühlung nicht beeinträchtigt.","criterion_en":"Clearance zones meet site/OEM rules; access and cooling unobstructed.","qualification":"Fachprüfer / Competent inspector","sources":"OEM;OM","flag":"","area":"trafo","condition":"trafo","variants":["outside"]},{"id":"TR-OUT-001","de":"Außen-Trafo: Wasserablauf und Entwässerung","en":"Outdoor transformer: drainage and runoff","applicability_de":"Außenaufstellung","applicability_en":"Outdoor installation","timing_de":"Erstprüfung / periodisch","timing_en":"Initial / periodic","method_de":"Wasseransammlungen, Abläufe und Ölauffangbereich äußerlich prüfen.","method_en":"Inspect ponding, drains and oil containment externally.","evidence_de":"Fotos, Entwässerungsplan","evidence_en":"Photos, drainage design","criterion_de":"Keine unzulässigen Wasserstände; Funktion nach Konzept.","criterion_en":"No unacceptable pooling; drainage per design.","qualification":"Elektrofachkraft / Qualified electrician","sources":"","flag":"","area":"trafo","condition":"trafo","variants":["outside"]},{"id":"TR-OUT-002","de":"Außen-Trafo: Anfahrschutz / mechanische Einwirkung","en":"Outdoor transformer: impact protection","applicability_de":"Außenaufstellung","applicability_en":"Outdoor installation","timing_de":"Erstprüfung / periodisch","timing_en":"Initial / periodic","method_de":"Schutz gegen Fahrzeuge, Mähgeräte und Fremdeinwirkung prüfen.","method_en":"Inspect protection against vehicles, mowing and external impact.","evidence_de":"Fotos, Lageplan","evidence_en":"Photos, site plan","criterion_de":"Erforderlicher Anfahrschutz vorhanden und unbeschädigt.","criterion_en":"Required impact protection present and intact.","qualification":"Elektrofachkraft / Qualified electrician","sources":"","flag":"","area":"trafo","condition":"trafo","variants":["outside"]},{"id":"TR-OUT-003","de":"Außen-Trafo: Witterungsschutz und korrosiver Zustand","en":"Outdoor transformer: weather exposure and corrosion","applicability_de":"Außenaufstellung","applicability_en":"Outdoor installation","timing_de":"Erstprüfung / periodisch","timing_en":"Initial / periodic","method_de":"Gehäuse, Beschichtung, Korrosion, Dichtungen und Schutz prüfen.","method_en":"Inspect enclosure, coatings, corrosion, seals and protecti function flushSave(){
 if(!pendingSave)return queue;
 clearTimeout(saveTimer);saveTimer=null;
 const current=pendingProject,finish=pendingResolve;
 pendingSave=null;pendingResolve=null;pendingProject=null;
 const plant={...current};delete plant.results;
 // Snapshot before enqueue: later edits must never silently be included in an earlier confirmation.
 const records=Object.entries(current.results||{}).map(([checkId,value])=>({checkId,value:structuredClone(value)}));
 const serialized=records.map(r=>[r.checkId,JSON.stringify(r.value)]);
 const changes=records.filter((r,i)=>fingerprints.get(current.id+'::'+r.checkId)!==serialized[i][1]).map(r=>({id:current.id+'::'+r.checkId,plantId:current.id,checkId:r.checkId,value:r.value}));
 queue=queue.catch(()=>{}).then(()=>store.saveState(plant,changes,current.id)).then(()=>{
  for(const [id,str] of serialized)fingerprints.set(current.id+'::'+id,str);
  saveFailed=false;if(!pendingSave)status(t('✓ Lokal gespeichert','✓ Saved locally'));finish(true);
 }).catch(e=>{
  saveFailed=true;status(t('⚠ Speicherfehler – Daten nicht gesichert','⚠ Save failed – data not saved'));
  console.error('PV Inspection save failed',e?.name,e?.message,e);
  if(!document.hidden)alert(t('Speicherung fehlgeschlagen: ','Saving failed: ')+(e?.name||'Error')+': '+(e?.message||'Unknown error'));
  finish(false);
 });return queue;
}

return `<h1>${t('Prüfprotokoll','Inspection record')}</h1>${team}${conditions}${others}`}

const walkKinds=[
 {id:'trafo',de:'Transformator',en:'Transformer',area:'trafo'},
 {id:'wr',de:'Wechselrichter',en:'Inverter',area:'wr'},
 {id:'gak',de:'GAK',en:'Combiner box',area:'dc'},
 {id:'dc',de:'DC-Anlage',en:'DC system',area:'dc'},
 {id:'monitor',de:'Monitoring',en:'Monitoring',area:'monitor'},
 {id:'modules',de:'PV-Module',en:'Modules',area:'modules'},
 {id:'ac',de:'AC-Sammelstation',en:'AC collection',area:'ms_station'},
 {id:'mount',de:'Unterkonstruktion',en:'Mounting structure',area:'mount'}
];
let selectedWalkId=null,selectedWalkAssetId=null;
function walks(){return project.walks||(project.walks=[])}
function selectedWalk(){return walks().find(w=>w.id===selectedWalkId)||walks()[0]}
function newWalk(){
 const label=prompt(t('Begehungsbereich / Station bezeichnen','Name walk / station'),t('Station','Station')+' '+(walks().length+1));
 if(!label?.trim())return;
 const walk={id:crypto.randomUUID(),name:label.trim(),assets:[],created:now()};
 walks().push(walk);selectedWalkId=walk.id;selectedWalkAssetId=null;save();go('walk')
}
function renameWalk(id){const walk=walks().find(w=>w.id===id);if(!walk)return;const name=prompt(t('Begehung umbenennen','Rename walk'),walk.name);if(name?.trim()){walk.name=name.trim();save();render()}}
function addWalkAsset(){
 const walk=selectedWalk();if(!walk)return;
 const kindId=document.getElementById('newWalkKind')?.value||'wr';
 const kind=walkKinds.find(x=>x.id===kindId);if(!kind)return;
 const name=(document.getElementById('newWalkAssetName')?.value||'').trim();
 if(!name){alert(t('Bitte eine Bezeichnung eintragen.','Enter an equipment designation.'));return}
 if(walk.assets.some(a=>a.kind===kindId&&a.name.toLocaleLowerCase()===name.toLocaleLowerCase())){alert(t('Bezeichnung bereits vorhanden.','Designation already exists.'));return}
 const asset={id:crypto.randomUUID(),kind:kindId,name,area:kind.area,created:now()};
 walk.assets.push(asset);selectedWalkAssetId=asset.id;save();render()
}
function editWalkAsset(id){
 const walk=selectedWalk(),asset=walk?.assets.find(x=>x.id===id);if(!asset)return;
 const name=prompt(t('Prüfobjekt umbenennen','Rename inspected object'),asset.name);
 if(!name?.trim()||name===asset.name)return;
 if(walk.assets.some(a=>a.id!==asset.id&&a.kind===asset.kind&&a.name.toLocaleLowerCase()===name.trim().toLocaleLowerCase())){alert(t('Bezeichnung bereits vorhanden.','Designation already exists.'));return}
 asset.name=name.trim();
 // Stable object ID keeps existing observations associated; shown label updated in related results.
 for(const r of Object.values(project.results||{}))if(r.targetId===id){if(asset.kind==='wr')r.wr=asset.name;r.part=walk.name}
 save();render()
}
function moveWalkAsset(id,offset){
 const walk=selectedWalk(),index=walk?.assets.findIndex(x=>x.id===id)??-1;
 if(index<0||index+offset<0||index+offset>=walk.assets.length)return;
 const [asset]=walk.assets.splice(index,1);walk.assets.splice(index+offset,0,asset);save();render()
}
function removeWalkAsset(id){
 const walk=selectedWalk(),asset=walk?.assets.find(x=>x.id===id);if(!asset)return;
 if(project.custom.some(c=>c.assetId===id)){
  alert(t('Dieses Prüfobjekt besitzt Prüfergebnisse. Es bleibt zur Nachverfolgbarkeit erhalten.','This object has inspection records and must be retained for traceability.'));return
 }
 if(!confirm(t('Prüfobjekt entfernen?','Remove inspected object?')))return;
 walk.assets=walk.assets.filter(x=>x.id!==id);selectedWalkAssetId=null;save();render()
}
function chooseWalk(id,assetId){
 selectedWalkId=id;selectedWalkAssetId=assetId||null;go('walk')
}
function openWalkCheck(walkId,assetId,baseId){
 const walk=walks().find(x=>x.id===walkId),asset=walk?.assets.find(x=>x.id===assetId);
 const base=catalog.checks.concat(project.custom).find(x=>x.id===baseId);
 if(!walk||!asset||!base)return;
 let target=project.custom.find(c=>c.walkId===walkId&&c.assetId===assetId&&c.baseCheckId===baseId);
 if(!target){
  target={...base,id:'OBJ-'+crypto.randomUUID().slice(0,12),baseCheckId:baseId,assetId,walkId,condition:'',variants:[]};
  project.custom.push(target)
 }
 const r=ensureResult(target.id);
 r.targetId=asset.id;r.walkId=walk.id;
 r.part=walk.name;
 if(asset.kind==='wr')r.wr=asset.name;
 if(!r.assetName)r.assetName=asset.name;
 selectedWalkId=walkId;selectedWalkAssetId=assetId;
 selectedArea=target.area;
 idx=checks(target.area).findIndex(c=>c.id===target.id);
 save();go('check')
}
function walkPage(){
 const walk=selectedWalk(),asset=walk?.assets.find(a=>a.id===selectedWalkAssetId)||walk?.assets[0];
 if(walk&&asset)selectedWalkAssetId=asset.id;
 const existing=walks().map(w=>`<button class="${w.id===walk?.id?'selected':''}" onclick="chooseWalk('${w.id}')">${esc(w.name)}</button>`).join('');
 const kinds=walkKinds.map(k=>`<option value="${k.id}">${t(k.de,k.en)}</option>`).join('');
 const assetChoices=(walk?.assets||[]).map(a=>`<div class="card"><div class="row between"><button class="${asset?.id===a.id?'selected':''}" onclick="chooseWalk('${walk.id}','${a.id}')">${esc(a.name)}</button><span class="muted small">${esc(walkKinds.find(k=>k.id===a.kind)?.[lang]||a.kind)}</span></div><div class="row"><button onclick="editWalkAsset('${a.id}')">${t('Umbenennen','Rename')}</button><button onclick="moveWalkAsset('${a.id}',-1)">↑</button><button onclick="moveWalkAsset('${a.id}',1)">↓</button><button onclick="removeWalkAsset('${a.id}')">×</button></div></div>`).join('');
 const applicable=asset?checks(asset.area).filter(c=>!c.assetId||c.assetId===asset.id).filter(c=>!c.baseCheckId):[];
 const related=asset?project.custom.filter(c=>c.assetId===asset.id):[];
 const defined=new Map(related.map(c=>[c.baseCheckId,c]));
 return `<h1>${t('Begehung','Site walk')}</h1><div class="card"><div class="row">${existing}<button class="primary" onclick="newWalk()">+ ${t('Neuer Begehung','New walk')}</button></div></div>${walk?`<div class="card"><div class="row between"><h2>${esc(walk.name)}</h2><button onclick="renameWalk('${walk.id}')">${t('Umbenennen','Rename')}</button></div><h3>${t('Komponente hinzufügen','Add component')}</h3><label class="field"><span>${t('Komponententyp','Component type')}</span><select id="newWalkKind">${kinds}</select></label><label class="field"><span>${t('Bezeichnung','Designation')}</span><input id="newWalkAssetName" placeholder="z. B. Trafo 3, WR3.5, WR3.7"></label><button class="primary" onclick="addWalkAsset()">+ ${t('Hinzufügen','Add')}</button><h3>${t('Prüfobjekte / Reihenfolge','Equipment / order')}</h3>${assetChoices||`<p class="muted">${t('Zuerst Komponenten erfassen.','Add components to begin.')}</p>`}</div>${asset?`<div class="card"><h2>${esc(asset.name)}</h2><p class="muted">${t('Prüfpunkte werden beim Öffnen nur für dieses Prüfobjekt angelegt.','Checks are instantiated for this object only when opened.')}</p><div class="check-list">${applicable.map(c=>{const saved=defined.get(c.id),r=saved&&project.results[saved.id];return `<button onclick="openWalkCheck('${walk.id}','${asset.id}','${c.id}')"><strong>${esc(c[lang])}</strong><br><small>${esc(c.id)} · ${esc(r?.status||t('Nicht begonnen','Not started'))}</small></button>`}).join('')}</div></div>`:''}`:`<p class="note">${t('Neuen Begehung anlegen, um die tatsächlich vorhandenen Komponenten zu erfassen.','Create a walk and add the components actually present on site.')}</p>`}`;
}
function catalogManagerPage(){
 const exclusions=new Set(project.checkExclusions||[]);
 const choices=catalog.checks.concat(project.custom);
 return `<h1>${t('Prüfkatalog anpassen','Customize inspection catalog')}</h1><p class="muted">${t('Änderungen gelten nur für diese Anlage. Die Basisdefinitionen bleiben erhalten.','Changes apply only to this plant. Base definitions are retained.')}</p><label class="field"><span>${t('Suchen','Search')}</span><input id="catalogSearch" placeholder="ID / Prüfpunkt"></label><div class="card" id="catalogEntries">${choices.map(c=>`<div data-catalog-row="${esc(c.id+' '+c.de+' '+c.en).toLocaleLowerCase()}" class="row between" style="padding:8px;border-bottom:1px solid #a6bbc8"><div style="flex:1;min-width:150px"><strong>${esc(c.id)}</strong> · ${esc(((project.checkOverrides||{})[c.id]||c)[lang])}${exclusions.has(c.id)?' · '+t('Ausgeschlossen','Excluded'):''}</div><div class="row"><button onclick="editCheck('${c.id}')">${t('Bearbeiten','Edit')}</button><button onclick="toggleCheck('${c.id}')">${exclusions.has(c.id)?t('Aktivieren','Enable'):t('Ausschließen','Exclude')}</button></div></div>`).join('')}</div>`;
}
function editCheck(id){
 const base=catalog.checks.concat(project.custom).find(c=>c.id===id);if(!base)return;
 const old=(project.checkOverrides||{})[id]||base;
 const title=prompt(t('Prüfpunktbezeichnung (DE)','Check title (DE)'),old.de||'');if(title===null)return;
 const method=prompt(t('Prüfmethode (DE)','Inspection method (DE)'),old.method_de||'');if(method===null)return;
 const criterion=prompt(t('Akzeptanzkriterium (DE)','Acceptance criterion (DE)'),old.criterion_de||'');if(criterion===null)return;
 if(!title.trim()){alert(t('Bezeichnung darf nicht leer sein.','Title cannot be empty.'));return}
 if(!project.checkOverrides)project.checkOverrides={};
 project.checkOverrides[id]={...(project.checkOverrides[id]||{}),de:title.trim(),method_de:method,criterion_de:criterion};
 save();render()
}
function toggleCheck(id){
 if(!project.checkExclusions)project.checkExclusions=[];
 const excluded=project.checkExclusions.includes(id);
 if(!excluded&&project.results[id]&&!confirm(t('Prüfpunkt besitzt Ergebnisse. Nur aus der aktiven Liste ausschließen, Daten bleiben erhalten?','This check has results. Exclude only from active list and retain history?')))return;
 project.checkExclusions=excluded?project.checkExclusions.filter(x=>x!==id):[...project.checkExclusions,id];
 save();render()
}

let resultsTab='overview',galleryFilter='all',galleryShown=12;
function setResultsTab(tab){resultsTab=tab;render()}
async function mediaBlob(id){const record=await store.one('media',id);if(!record?.blob)throw new Error('Evidence not found: '+id);return record.blob}
async function showMedia(el){
 const id=el.dataset.mediaId;if(!id||!el.isConnected)return;
 try{const blob=await mediaBlob(id);if(!el.isConnected||el.dataset.mediaId!==id)return;
 const url=URL.createObjectURL(blob);mediaUrls.add(url);el.src=url;
 }catch(e){el.alt=t('Datei fehlt','Evidence missing');console.error('Media load failed',e)}
}
function loadVisibleMedia(){
 const nodes=[...document.querySelectorAll('[data-media-id]')];
 if(!nodes.length)return;
 if('IntersectionObserver' in window){
  const observer=new IntersectionObserver(entries=>{for(const e of entries)if(e.isIntersecting){observer.unobserve(e.target);showMedia(e.target)}},{rootMargin:'180px'});
  nodes.forEach(node=>observer.observe(node));
 }else nodes.forEach(showMedia);
}
async function mediaDownload(id,name){
 try{const blob=await mediaBlob(id);const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name||'evidence';a.click();setTimeout(()=>URL.revokeObjectURL(url),10000)}
 catch(e){alert(t('Datei nicht verfügbar: ','Evidence unavailable: ')+e.message)}
}
async function thumb(blob){
 if(!blob.type.startsWith('image/'))return null;
 try{
  const bmp=await createImageBitmap(blob);const scale=Math.min(1,700/Math.max(bmp.width,bmp.height));
  const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(bmp.width*scale));canvas.height=Math.max(1,Math.round(bmp.height*scale));
  canvas.getContext('2d').drawImage(bmp,0,0,canvas.width,canvas.height);bmp.close();
  return await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',0.75))
 }catch(e){console.warn('Thumbnail creation unavailable',e);return null}
}

function defectsPage(){if(resultsTab==='gallery')return galleryPage();
 const applicable=allChecks(),valid=new Set(applicable.map(c=>c.id));
 const states={pass:[],fail:[],na:[],pending:[],unexecuted:[]};
 for(const c of applicable){const r=project.results[c.id];const status=r?.status;if(status==='pass')states.pass.push(c);else if(status==='fail')states.fail.push(c);else if(status==='na')states.na.push(c);else if(status==='pending'&&r)states.pending.push(c);else states.unexecuted.push(c)}
 const fails=Object.entries(project.results).filter(([id,r])=>r.status==='fail'&&!valid.has(id));
 const all=states.fail.map(c=>({id:c.id,v:project.results[c.id],check:c})).concat(fails.map(([id,v])=>({id,v,check:catalog.checks.concat(project.custom).find(c=>c.id===id)})));
 const other=project.findings||[];
 const total=applicable.length,executed=states.pass.length+states.fail.length+states.na.length;
 const cards=[['pass',t('OK / Bestanden','OK / Passed')],['fail',t('NOK / Mangel','NOK / Failed')],['pending',t('Offen / Pending','Pending')],['unexecuted',t('Nicht ausgeführt','Not executed')],['na',t('Entfällt / N/A','Not applicable')]];
 const list=all.map(x=>`<div class="card danger"><strong>${esc(x.id)} · ${esc(x.check?.[lang]||'')}</strong><p>${esc(x.v.part)} ${esc(x.v.wr)} ${esc(x.v.table)} ${esc(x.v.string)}</p><p>${esc(x.v.note||t('Noch keine Beschreibung','No description'))}</p><span class="pill">${esc(x.v.severity||'S2')}</span><button onclick="jump('${x.id}')">${t('Öffnen','Open')}</button></div>`).join('');
 return `<h1>${t('Ergebnisse','Results')}</h1><div class="row"><button class="selected">${t('Übersicht','Overview')}</button><button onclick="setResultsTab('gallery')">${t('Fotogalerie','Photo gallery')}</button></div><div class="card"><h2>${t('Prüfübersicht','Inspection summary')}</h2><p><strong>${executed} / ${total}</strong> ${t('Prüfpunkte abgeschlossen','checks completed')}</p><div class="bar"><div style="width:${total?executed/total*100:0}%"></div></div><div class="grid">${cards.map(([k,name])=>`<div class="card"><strong>${name}</strong><h2>${states[k].length}</h2></div>`).join('')}</div><p class="muted small">${t('Offen: Prüfpunkt wurde als Pending gespeichert. Nicht ausgeführt: noch kein Ergebnis erfasst. Entfällt: als N/A bewertet.','Pending: check explicitly saved as pending. Not executed: no result recorded. N/A: marked not applicable.')}</p></div><h2>${t('Mängel & Befunde','Defects & findings')}</h2><p>${all.length} ${t('nicht bestandene Prüfungen','failed checks')} · ${other.length} ${t('spontane Befunde','ad-hoc findings')}</p>${list}${other.map(x=>`<div class="card danger"><strong>${esc(x.area)} · ${esc(x.title)}</strong><p>${esc(x.note)}</p><small>${new Date(x.created).toLocaleString(lang)}</small></div>`).join('')}<button onclick="addFinding('docs')">+ ${t('Spontanen Befund hinzufügen','Add finding')}</button>`
}

function ensureResult(id){if(!project.results[id])project.results[id]={status:'pending',part:'',wr:'',table:'',string:'',serial:'',inspector:lead()?.name||'',note:'',severity:'S2',owner:'',due:'',evidence:'',photos:[],created:now(),modified:now(),dayId:day()?.id||'',history:[]};return project.results[id]}
function setResult(id,k,v){if(k==='status'&&!roster().some(p=>p.name?.trim())){alert(t('Bitte zuerst mindestens einen Prüfer unter Prüftag eintragen.','Please enter at least one inspector in Inspection day first.'));go('day');return}const r=ensureResult(id);if(k==='status'&&v==='pass'&&id.endsWith('PLATE-PHOTO')&&!(r.photos||[]).length){alert(t('Bitte zuerst ein Typenschild-Foto anhängen.','Attach a nameplate photo first.'));return}if(!r.inspector&&lead())r.inspector=lead().name;const old=r[k];if(old===v)return;r[k]=v;r.modified=now();r.history.push({at:r.modified,field:k,old,new:v});save();if(k==='status')render()}

function photoGpsText(p){if(!p.gps)return '';const g=p.gps;return (g.source==='exif'?t('GPS aus EXIF','GPS from EXIF'):t('GPS vom iPhone','GPS from iPhone'))+': '+g.lat.toFixed(6)+', '+g.lon.toFixed(6)+(Number.isFinite(g.accuracy)?' (±'+Math.round(g.accuracy)+' m)':'')}
async function readExifGps(file){
 try{
 const b=new DataView(await file.arrayBuffer());if(b.byteLength<12||b.getUint16(0)!==0xffd8)return null;
 let p=2;while(p+4<b.byteLength){const mark=b.getUint16(p);p+=2;if(mark===0xffda||mark===0xffd9)break;const len=b.getUint16(p);p+=2;if(len<2||p+len-2>b.byteLength)break;
 if(mark===0xffe1&&b.getUint32(p)===0x45786966&&b.getUint16(p+4)===0){const base=p+6;const le=b.getUint16(base)===0x4949;const u16=o=>b.getUint16(o,le),u32=o=>b.getUint32(o,le);
 if(u16(base+2)!==42)return null;
 const tags=(pos)=>{const obj={};const n=u16(pos);if(n>128)return obj;for(let j=0;j<n;j++){const e=pos+2+j*12;if(e+12>b.byteLength)break;obj[u16(e)]={type:u16(e+2),count:u32(e+4),slot:e+8}}return obj};
 const gpsPtr=tags(base+u32(base+4))[0x8825];if(!gpsPtr)return null;const dir=tags(base+u32(gpsPtr.slot));
 const val=tag=>{const v=dir[tag];if(!v)return null;let o=v.slot;if(v.count*(v.type===5?8:v.type===3?2:1)>4)o=base+u32(o);if(o<0||o>=b.byteLength)return null;
 if(v.type===2)return String.fromCharCode(...new Uint8Array(b.buffer,b.byteOffset+o,Math.min(v.count,8))).replace(/\0/g,'');
 if(v.type===5){const a=[];for(let j=0;j<v.count&&j<3;j++){const d=u32(o+8*j+4);a.push(d?u32(o+8*j)/d:0)}return a}
 if(v.type===1)return b.getUint8(o);return null};
 const degrees=a=>Array.isArray(a)&&a.length===3?a[0]+a[1]/60+a[2]/3600:null;
 const lat=degrees(val(2)),lon=degrees(val(4));if(lat===null||lon===null)return null;
 const g={source:'exif',lat:val(1)==='S'?-lat:lat,lon:val(3)==='W'?-lon:lon};
 const alt=val(6);if(alt?.length)g.altitude=(val(5)===1?-1:1)*alt[0];
 return g;
 }p+=len-2}
 }catch(e){console.warn('EXIF GPS:',e)}return null
}

async function backup(){
 try{
  await flushSave();if(saveFailed)throw new Error('Unsaved changes. Backup aborted.');
  status(t('Backup wird erstellt…','Building backup…'));
  const copy=structuredClone(project);
  const ids=new Set();
  for(const result of Object.values(copy.results||{})){
   for(const p of result.photos||[]){if(p.id)ids.add(p.id);if(p.thumbId)ids.add(p.thumbId)}
   for(const a of result.voices||[])if(a.id)ids.add(a.id);
  }
  const entries=[];const media=[];
  for(const id of ids){
   const item=await store.one('media',id);
   if(!item?.blob)throw new Error('Missing evidence: '+id);
   entries.push({name:'media/'+id,blob:item.blob});
   media.push({id,kind:item.kind||'',resultId:item.resultId,name:item.name||'',mime:item.mime||'',size:item.blob.size,at:item.at||''});
  }
  const manifest={format:'pv-inspection-backup-2',exported:now(),appVersion:'0.6.0',catalogVersion:copy.catalogVersion||catalog.version,catalog,project:copy,media};
  const archive=await PVBackupV06.create([{name:'manifest.json',blob:JSON.stringify(manifest)},...entries]);
  saveFile('PV-Inspection_'+backupStamp()+'.zip',archive);
  status(t('Backup bereit — Datei an externem Speicherort prüfen','Backup ready — verify the downloaded file'));
 }catch(e){
  console.error('Backup failed',e);status(t('⚠ Backup fehlgeschlagen','⚠ Backup failed'));
  alert(t('Backup fehlgeschlagen: ','Backup failed: ')+e.message)
 }
}
async function restoreBackup(file){
 if(!file)return;
 try{
  status(t('Backup wird geprüft…','Verifying backup…'));
  const {manifest,entries}=await PVBackupV06.read(file);
  if(manifest.format!=='pv-inspection-backup-2'||!manifest.project?.id||!Array.isArray(manifest.media))throw Error('Unsupported backup');
  const source=manifest.project;
  const existing=(await getAll('projects')).some(x=>x.id===source.id);
  if(!confirm(t('Backup als neue Anlage importieren?','Import backup as a separate plant?')))return;
  await flushSave();
  const target=structuredClone(source);
  target.id=crypto.randomUUID();
  if(existing)target.name=(target.name||'Anlage')+' (Import)';
  const mapping=new Map(manifest.media.map(m=>[m.id,crypto.randomUUID()]));
  for(const result of Object.values(target.results||{})){
   for(const item of result.photos||[]){if(item.id)item.id=mapping.get(item.id)||item.id;if(item.thumbId)item.thumbId=mapping.get(item.thumbId)||item.thumbId}
   for(const item of result.voices||[])if(item.id)item.id=mapping.get(item.id)||item.id;
  }
  let success=false;
  try{
   for(const m of manifest.media){
    const blob=entries.get('media/'+m.id);
    if(!blob||blob.size!==m.size)throw Error('Evidence size mismatch '+m.id);
    const newId=mapping.get(m.id);
    await store.storeMedia(target.id,m.resultId,blob.slice(0,blob.size,m.mime||'application/octet-stream'),{id:newId,kind:m.kind,name:m.name,at:m.at});
   }
   const resultRecords=Object.entries(target.results||{}).map(([checkId,value])=>({id:target.id+'::'+checkId,plantId:target.id,checkId,value}));
   await store.saveState(target,resultRecords,target.id);
   success=true;
  }finally{
   if(!success)await store.deletePlant(target.id).catch(error=>console.error('Import rollback failed',error))
  }
  project=target;fingerprints=new Map();syncGlobalRoster();
  status(t('✓ Backup importiert','✓ Backup imported'));go('home')
 }catch(e){console.error('Restore failed',e);status(t('⚠ Import fehlgeschlagen','⚠ Import failed'));alert(t('Import fehlgeschlagen: ','Import failed: ')+e.message)}
}
