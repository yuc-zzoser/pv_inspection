s":"712;62446","flag":"Sicherheitskritisch / Safety-critical","condition":""},{"id":"DC-012","area":"dc","de":"Leerlaufspannung","en":"Open-circuit voltage","applicability_de":"Alle Anlagen","applicability_en":"All plants","timing_de":"Erstprüfung","timing_en":"Initial","method_de":"String-Voc mit Temperatur und Stringbelegung vergleichen","method_en":"Compare string Voc accounting for temperature/configuration","evidence_de":"Voc-Messwerte, Temperatur, Stringliste","evidence_en":"Voc readings, temperature, string schedule","criterion_de":"Im erwarteten projektspezifischen Bereich","criterion_en":"Within project-specific expected range","qualification":"Elektrofachkraft / Qualified electrician","sources":"712;62446","flag":"","condition":""},{"id":"DC-013","area":"dc","de":"Isolationswiderstand PV-DC","en":"Installed DC insulation resistance","applicability_de":"Alle Anlagen","applicability_en":"All plants","timing_de":"Erstprüfung","timing_en":"Initial","method_de":"Inbetriebnahmeprotokoll prüfen; Wiederholung isoliert nach freigegebenem Verfahren","method_en":"Review commissioning test; retest only safely isolated","evidence_de":"Prüfprotokoll, Testspannung, Grenzbezug","evidence_en":"Test log, test voltage, specified limit","criterion_de":"Messung erfüllt angewendete installationsbezogene Prüfvorgabe","criterion_en":"Passes applicable installed-system test requirement","qualification":"Elektrofachkraft / Qualified electrician","sources":"712;62446","flag":"Sicherheitskritisch / Safety-critical","condition":""},{"id":"DC-014","area":"dc","de":"Potentialausgleich DC-Feld","en":"PV-array equipotential bonding","applicability_de":"Alle Anlagen","applicability_en":"All plants","timing_de":"Erstprüfung","timing_en":"Initial","method_de":"Verbindungen und Durchgängigkeit prüfen","method_en":"Inspect bonding and continuity evidence","evidence_de":"PE-/PA-Plan, Messwerte","evidence_en":"Bonding plan, results","criterion_de":"Ausführung entsprechend Schutzkonzept","criteri },{"id":"DC-019","area":"dc","de":"Steckverbinder: Material- und Typnachweis je Paarung","en":"Connector pair identification and traceability","applicability_de":"Alle DC-Steckverbinder-Stichproben","applicability_en":"All sampled DC connectors","timing_de":"Erstprüfung","timing_en":"Initial","method_de":"Stecker und Buchse einzeln auf Hersteller/Typ prüfen und auf identische oder explizit freigegebene Paarung verifizieren.","method_en":"Individually identify male/female manufacturer/type and verify same-type or expressly approved mating.","evidence_de":"Fotodokumentation, Stückliste und Paarungsfreigabe","evidence_en":"Photographic record, bill of materials and mating approval","criterion_de":"Hersteller-/Typfreigabe für jede beurteilte Kombination nachgewiesen; TR 63225 als Risiko-Hinweis, nicht alleinige Verbotsnorm.","criterion_en":"Manufacturer/type mating approval demonstrated for each inspected pair; TR 63225 is risk guidance, not by itself a prohibition.","qualification":"Elektrofachkraft / Qualified electrician","sources":"63225;OEM","flag":"","condition":""},{"id":"IEA-2-2","area":"dc","de":"Kontaktdefekt am DC-Steckverbinder","en":"DC connector contact defect","applicability_de":"Alle Anlagen","applicability_en":"All plants","timing_de":"Erstprüfung / Bei Verdacht","timing_en":"Initial / If suspected","method_de":"Verriegelung/Gehäuse visuell prüfen; IR nur unter Last","method_en":"Visually inspect latch/housing; IR only under load","evidence_de":"Steckertyp, Fotobeleg, ggf. IR","evidence_en":"Connector type, image, IR if available","criterion_de":"Kein loser, beschädigter oder überhitzter Kontakt","criterion_en":"No loose, damaged or overheated contact","qualification":"Elektrofachkraft / Qualified electrician","sources":"PVFS 2-2","flag":"IEA-Empfehlung / IEA guidance","condition":""},{"id":"IEA-2-3","area":"dc","de":"Isolationsdefekt an DC-Leitung","en":"DC cable insulation failure","applicability_de":"Alle Anlagen","applicability_en":"All plants","tim ctor","sources":"EPC;OM","flag":"","condition":""},{"id":"MOD-006","area":"modules","de":"Modulklemmposition gemäß Montageanleitung","en":"Module clamp position per installation manual","applicability_de":"Alle Anlagen","applicability_en":"All plants","timing_de":"Erstprüfung","timing_en":"Initial","method_de":"Montageanleitung für konkreten Modultyp und Montageart prüfen; Abstand der Klemmen zu Modulecken messen.","method_en":"Check the exact module model manual for the mounting configuration; measure clamp-to-corner positions.","evidence_de":"Hersteller-Montageanleitung (Revision), Maßfotos / Stichprobenprotokoll","evidence_en":"Manufacturer installation manual (revision), dimensioned photos / sample record","criterion_de":"Positionen innerhalb der für Montageart/Lastfall freigegebenen Klemmzonen der zutreffenden Anleitung.","criterion_en":"Locations within manufacturer-approved clamping zones for mounting configuration and load case.","qualification":"PV-Fachprüfer / PV inspector","sources":"OEM;EPC","flag":"","condition":""},{"id":"MOD-007","area":"modules","de":"Modulklemmfestigkeit","en":"Module clamp integrity","applicability_de":"Alle Anlagen","applicability_en":"All plants","timing_de":"Erstprüfung","timing_en":"Initial","method_de":"Lockere oder fehlende Klemmen suchen","method_en":"Check missing or loose clamps","evidence_de":"Fotos, Montageprotokoll","evidence_en":"Photos, assembly report","criterion_de":"Alle geprüften Klemmen korrekt und fest","criterion_en":"All sampled clamps secured","qualification":"PV-Fachprüfer / PV inspector","sources":"EPC;OM","flag":"","condition":""},{"id":"MOD-008","area":"modules","de":"Kabel unter Modulen","en":"Under-module cable management","applicability_de":"Alle Anlagen","applicability_en":"All plants","timing_de":"Erstprüfung","timing_en":"Initial","method_de":"Keine frei hängenden Leitungen oder Kontakt zu scharfen Kanten","method_en":"Check hanging leads and sharp-edge contact","evidence_de":"Fotostichprobe","evidence_en":"Photo sample","criterion_de":"Kein Scheuer-/Zugrisiko sichtbar","criterion_en":"No observable abrasion or tensile risk","qualification":"PV-Fachprüfer / PV inspector","sources":"EPC;OM","flag":"","condition":""},{"id":"MOD-009","area":"modules","de":"Zulässige Modulmontageart","en":"Permitted module mounting configuration","applicability_de":"Alle geklemmten Module","applicability_en":"All clamped modules","timing_de":"Erstprüfung","timing_en":"Initial","method_de":"Einbaulage, Orientierung, Stützabstände und Klemmvariante mit modellspezifischer Anleitung vergleichen.","method_en":"Compare orientation, support spacing and clamp configuration with model-specific manual.","evidence_de":"Montageanleitung mit Revision, Fotos, Ausführungspläne","evidence_en":"Revised installation manual, photographs, as-built drawings","criterion_de":"Konkrete Einbauart/Orientierung nach Montageanleitung und statischem Nachweis freigegeben.","criterion_en":"Actual mounting method/orientation permitted by module manual and structural calculation.","qualification":"PV-Fachprüfer / PV inspector","sources":"OEM;EPC","flag":"","condition":""},{"id":"MOD-010","area":"modules","de":"Klemmenlänge und -breite","en":"Clamp length and width","applicability_de":"Alle geklemmten Module","applicability_en":"All clamped modules","timing_de":"Erstprüfung","timing_en":"Initial","method_de":"Abmessungen der verbauten Klemmauflage messen; mit Mindest-/Höchstmaßen laut Modulhersteller vergleichen.","method_en":"Measure contact dimensions of fitted clamps; compare with module OEM dimensions.","evidence_de":"Messfotos, Klemmendatenblatt, Modulmontageanleitung","evidence_en":"Dimensioned photos, clamp datasheet, module installation manual","criterion_de":"Auflageabmessungen erfüllen modellspezifische Herstelleranforderungen.","criterion_en":"Clamp contact dimensions meet model-specific OEM requirements.","qualification":"PV-Fachprüfer / PV inspector","sources":"OEM;EPC","flag":"","condition":""},{"id" function openDb(){return new Promise((ok,no)=>{let r=indexedDB.open('pv-field-db',1);r.onupgradeneeded=()=>{let d=r.result;d.createObjectStore('projects',{keyPath:'id'});d.createObjectStore('app',{keyPath:'key'})};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}function put(store,v){return new Promise((ok,no)=>{const tr=db.transaction(store,'readwrite');tr.objectStore(store).put(v);tr.oncomplete=()=>ok();tr.onerror=()=>no(tr.error);tr.onabort=()=>no(tr.error)})}function getAll(store){return new Promise((ok,no)=>{let tr=db.transaction(store);let r=tr.objectStore(store).getAll();r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}let queue=Promise.resolve();function save(){project.meta.modified=now();status(t('Wird gespeichert…','Saving…'));const snapshot=structuredClone(project);queue=queue.catch(()=>{}).then(()=>put('projects',snapshot)).then(()=>put('app',{key:'current',id:project.id})).then(()=>{status(t('✓ Lokal gespeichert','✓ Saved locally'))}).catch(e=>{status(t('⚠ Speicherfehler','⚠ Save failed'));alert(t('Speicherung fehlgeschlagen: ','Saving failed: ')+e.message)});return queue}function change(path,val){let o=project;const p=path.split('.');for(let i=0;i<p.length-1;i++)o=o[p[i]];o[p.at(-1)]=val;save()}function touchInput(el,fn){el.addEventListener('input',e=>fn(e.target.value));el.addEventListener('change',e=>fn(e.target.value))}function field(label,val,fn,type='text'){const id='f'+Math.random().toString(36).slice(2);return `<label class="field"><span>${label}</span><input id="${id}" ${type==='number'?'inputmode="decimal"':''} type="${type}" value="${esc(val)}"></label>`}
function bindField(id,fn){let el=$(id);if(el)touchInput(el,fn)}function elField(label,key){const id='p_'+key;return `<label class="field"><span>${label}</span><input id="${id}" value="${esc(project[key])}"></label>`}function cField(label,key){const id='c_'+key;return `<label class="toggle"><input id="${id}" type="checkbox" ${project.config[key]?'checked':''}> ${label}</label>`}function bindConfig(){for(let k of ['trafo','tracker','bifacial','gak','remote','storage','fpv','apv'])$('c_'+k).onchange=e=>{change('config.'+k,e.target.checked);render()};for(let k of ['voltage','inv','dcVoltage','mountType'])$('c_'+k).onchange=e=>{change('config.'+k,e.target.value);render()}}
function activeAreas(){return catalog.areas.filter(a=>!['trafo','storage','fpv','apv'].includes(a.id)||project.config[a.id])}function checks(area){let full=catalog.checks.concat(project.custom).filter(c=>c.area===area);return full.filter(c=>!c.condition||project.config[c.condition]||c.condition==='gak'&&project.config.gak)}function allChecks(){return activeAreas().flatMap(a=>checks(a.id))}function count(area){const c=checks(area),done=c.filter(x=>['pass','fail','na'].includes(project.results[x.id]?.status)).length;return [done,c.length]}function day(){return project.days.at(-1)}function addDay(){project.days.push({id:crypto.randomUUID(),date:new Date().toISOString().slice(0,10),start:'',end:'',weather:'',temp:'',wind:'',irr:'',notes:'',inspectorIds:lead()?.id?[lead().id]:[],people:[]});save()}

['fpv','FPV'],['apv','APV']].map(([k,l])=>cField(l,k)).join('')}</div><p class="muted small">${t('Ausgeblendete Prüfergebnisse bleiben erhalten. Änderungen der Konfiguration müssen fachlich bewertet werden.','Hidden inspection results remain stored. Configuration changes require engineering review.')}</p></div><button class="primary" onclick="go('areas')">${t('Prüfbereiche öffnen →','Open sections →')}</button>`}
function dayPage(){if(!day())addDay();const d=day(),available=roster().filter(p=>p.name?.trim()),chosen=Array.isArray(d.inspectorIds)?d.inspectorIds:(lead()?.id?[lead().id]:[]);
const team=`<div class="card"><h2>${t('Prüfer / Prüfteam','Inspectors / inspection team')}</h2><p class="muted small">${t('Prüfer werden in Einstellungen für alle Anlagen gepflegt.','Inspectors are managed for all plants in Settings.')}</p>${available.map(p=>`<label class="toggle"><input type="checkbox" data-day-inspector="${esc(p.id)}" ${chosen.includes(p.id)?'checked':''}><span>${esc(p.name)}${p.company?' · '+esc(p.company):''}</span></label>`).join('')||`<p class="warn">${t('Bitte Prüfer unter Einstellungen erfassen.','Add an inspector in Settings.')}</p>`}<label class="field"><span>${t('Verantwortlicher Hauptprüfer','Lead inspector')}</span><select id="leadInspector"><option value="">—</option>${available.map(p=>`<option value="${esc(p.id)}" ${lead()?.id===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></label></div>`;

const others=`<div class="card"><div class="row between"><h2>${t('Weitere anwesende Personen','Other people present')}</h2><button onclick="addPerson()">+ ${t('Person hinzufügen','Add person')}</button></div><p class="muted small">${t('Begleitpersonen, Betreiber, Techniker; keine Prüfer.','Visitors, operators, technicians; not inspectors.')}</p>${(d.people||[]).map((p,i)=>`<div class="card"><h3>${t('Anwesende Person','Person present')} ${i+1}</h3><button onclick="removePerson('${p.id}')">${t('Entfernen','Remove')}</button>${[['name',t('Name','Name')],['company',t('Firma','Company')],['role',t('Funktion','Role')],['from',t('Von','From')],['to',t('Bis','Until')]].map(([k,l])=>`<label class="field"><span>${l}</span><input data-day-person="${esc(p.id)}" data-person-key="${k}" ${k==='from'||k==='to'?'type="time"':''} value="${esc(p[k]||'')}"></label>`).join('')}</div>`).join('')}</div>`;
return `<h1>${t('Prüfprotokoll','Inspection record')}</h1>${team}${conditions}${others}`}
function areaCards(){return activeAreas().map(a=>{const [done,total]=count(a.id);const failed=checks(a.id).filter(c=>project.results[c.id]?.status==='fail').length;return `<button class="area" type="button" onclick="selectArea('${a.id}')"><strong>${esc(a[lang]||a.de||a.id)}</strong><small>${done}/${total} ${t('erledigt','done')}${failed?' · '+failed+' '+t('Mängel','defects'):''}</small><div class="bar"><div style="width:${total?done/total*100:0}%"></div></div></button>`}).join('')||`<p>${t('Keine aktiven Prüfbereiche','No active sections')}</p>`} 
function areasPage(){return `<h1>${t('Prüfbereiche','Inspection sections')}</h1><p>${t('Jeden Bereich unabhängig öffnen.','Open any section independently.')}</p><div class="grid">${areaCards()}</div><div class="card"><button onclick="go('guided')">${t('Geführten Ablauf öffnen →','Open guided inspection →')}</button></div>`}
function guidedPage(){const a=activeAreas();return `<h1>${t('Geführte Prüfung','Guided inspection')}</h1><p>${t('Empfohlene Reihenfolge. Bereiche können jederzeit übersprungen werden.','Suggested order; sections may be skipped anytime.')}</p><div class="grid">${a.map((v,i)=>{let [n,tot]=count(v.id);return `<button class="area" onclick="selectArea('${v.id}')"><strong>${i+1}. ${esc(v[lang])}</strong><small>${n}/${tot}</small><div class="bar"><div style="width:${tot?100*n/tot:0}%"></div></div></button>`}).join('')}</div>`}
function checkPage(){let arr=checks(selectedArea),c=arr[idx];if(!c)return `<h1>${t('Keine Prüfpunkte','No checks')}</h1><button onclick="addCustom('${selectedArea}')">+ ${t('Prüfpunkt','Check')}</button>`;let r=project.results[c.id]||{status:'pending',part:'',wr:'',table:'',string:'',serial:'',inspector:lead()?.name||'',note:'',severity:'S2',owner:'',due:'',evidence:'',created:now(),modified:now(),dayId:day()?.id||'',history:[]};let a=catalog.areas.find(v=>v.id===selectedArea);let options=['pass','fail','na','pending'];let labels={pass:t('✓ Bestanden','✓ Pass'),fail:t('✕ Mangel','✕ Fail'),na:t('— Entfällt','— N/A'),pending:t('◷ Offen','◷ Pending')};return `<div class="row between"><button onclick="go('areas')">← ${t('Bereiche','Sections')}</button><span class="pill">${idx+1} / ${arr.length}</span></div><div class="card"><div class="row between"><span class="pill">${esc(c.id)}</span><span>${esc(a?.[lang]||selectedArea)}</span></div><h1>${esc(c[lang])}</h1><p class="note"><strong>${t('Prüfmethode','Inspection method')}:</strong><br>${esc(c['method_'+lang])}</p><p class="note"><strong>${t('Akzeptanzkriterium','Acceptance criterion')}:</strong><br>${esc(c['criterion_'+lang]||t('Projekt- und Herstelleranforderungen prüfen','Check applicable project/OEM criteria'))}</p><p class="note"><strong>${t('Nachweis','Evidence')}:</strong> ${esc(c['evidence_'+lang]||'—')} · <strong>${t('Zeitpunkt','Timing')}:</strong> ${esc(c['timing_'+lang]||'—')}</p><p class="muted small">${esc(c['applicability_'+lang]||'')} · ${esc(c.sources||'')}</p><div class="row"><button onclick="addCustom('${selectedArea}')">+ ${t('Prüfpunkt','Check')}</button><button onclick="addFinding('${selectedArea}')">+ ${t('Befund','Finding')}</button><button type="button" onclick="document.getElementById('photoInput').click()" aria-label="${t('Foto hinzufügen','Attach photo')}" title="${t('Foto hinzufügen','Attach photo')}">📷</button><input type="file" id="photoInput" accept="image/*" capture="environment" style="display:none"></div><h2>${t('Ergebnis','Result')}</h2><div class="result-grid">${options.map(x=>`<button class="${x} ${r.status===x?'selected':''}" onclick="setResult('${c.id}','status','${x}')">${labels[x]}</button>`).join('')}</div><h2>${t('Prüfobjekt','Inspected object')}</h2><div class="two">${[['part',t('Anlagenteil','Plant section')],['wr',t('WR-Nr.','Inverter no.')],['table',t('Tisch','Table')],['string',t('Strang','String')],['serial',t('Modul-Seriennummer','Module serial')]].map(([k,l])=>`<label class="field"><span>${l}</span><input data-result="${k}" value="${esc(r[k])}"></label>`).join('')}</div>${inspectorSelect(r)}${c.measurement?`<div class="card"><h2>${t('Ist-Wert / Aufnahme','Recorded value')}</h2><label class="field"><span>${t('Messwert / Kennzeichnung','Measured value / designation')} ${esc(c.measurement.unit||'')}</span>${c.measurement.kind==='select'?`<select data-result="measured"><option value="">—</option>${c.measurement.options.map(o=>`<option value="${esc(o.value)}" ${(r.measured??'')===o.value?'selected':''}>${esc(o[lang]||o.value)}</option>`).join('')}</select>`:`<input data-result="measured" type="${c.measurement.kind==='number'?'number':'text'}" ${c.measurement.kind==='number'?'inputmode="decimal" step="any"':''} value="${esc(r.measured??'')}" placeholder="${c.measurement.kind==='number'?'z. B. 15':'z. B. NAYY / 5 × 50 mm²'}">`}</label><p class="muted small">${t('Wert gehört zum oben gewählten Prüfobjekt. Mit Bestandsplanung vergleichen.','Value belongs to selected inspected object. Compare with approved design.')}</p></div>`:''}${c.id.endsWith('PLATE-PHOTO')?`<p class="note">${(r.photos||[]).length?`✓ ${t('Foto angehängt','Photo attached')}: ${(r.photos||[]).length}`:t('To-do: Foto unten hinzufügen und Lesbarkeit prüfen, bevor die Prüfung als bestanden markiert wird.','To-do: attach a photograph below and verify legibility before marking as passed.')}</p>`:''}${(r.photos||[]).map((p,i)=>`<div class="photo-row"><strong>📷 ${esc(p.name||t('Sin nombre','Unnamed photo'))}</strong> ${p.originalName?`<span class="small">(${t('Original','Original')}: ${esc(p.originalName)})</span>`:''}<img class="photo-preview" src="${p.data}" alt="${esc(p.name)}"><div class="row"><button onclick="downloadPhoto('${c.id}',${i})">↓ ${t('Descargar imagen','Download photo')}</button><button onclick="removePhoto('${c.id}',${i})">× ${t('Eliminar','Remove')}</button></div></div>`).join('')}<details ${r.status==='fail'||c.id.endsWith('PLATE-PHOTO')?'open':''}><summary>${t('Befund / zusätzliche Angaben','Finding / additional information')}</summary><label class="field"><span>${t('Bemerkung / Mangel','Comment / defect')}</span><textarea data-result="note">${esc(r.note)}</textarea></label><label class="field"><span>${t('Schweregrad','Severity')}</span><select data-result="severity">${['S1','S2','S3','Observation'].map(s=>`<option ${r.severity===s?'selected':''}>${s}</option>`).join('')}</select></label><label class="field"><span>${t('Verantwortlich','Responsible')}</span><input data-result="owner" value="${esc(r.owner)}"></label><label class="field"><span>${t('Frist','Deadline')}</span><input type="date" data-result="due" value="${esc(r.due)}"></label><label class="field"><span>${t('Nachweisreferenz','Evidence ref')}</span><input data-result="evidence" value="${esc(r.evidence)}"></label></details><p class="muted small">${t('Erfasst','Created')}: ${new Date(r.created).toLocaleString(lang)} · ${t('Geändert','Modified')}: ${new Date(r.modified).toLocaleString(lang)}</p></div><div class="sticky-actions"><button onclick="next(${idx-1})" ${idx===0?'disabled':''}>← ${t('Zurück','Previous')}</button><button onclick="sameNext()">${t('Gleiche Prüfung / neues Objekt','Same check / next object')}</button><button class="primary" onclick="next(${idx+1})" ${idx===arr.length-1?'disabled':''}>${t('Weiter','Next')} →</button></div>`}
function defectsPage(){let fails=Object.entries(project.results).filter(([k,v])=>v.status==='fail');let all=fails.map(([id,v])=>({id,v,check:catalog.checks.concat(project.custom).find(c=>c.id===id)}));let other=project.findings;return `<h1>${t('Mängel & Befunde','Defects & findings')}</h1><p>${all.length} ${t('nicht bestandene Prüfungen','failed checks')} · ${other.length} ${t('spontane Befunde','ad-hoc findings')}</p>${all.map(x=>`<div class="card danger"><strong>${esc(x.id)} · ${esc(x.check?.[lang]||'')}</strong><p>${esc(x.v.part)} ${esc(x.v.wr)} ${esc(x.v.table)} ${esc(x.v.string)}</p><p>${esc(x.v.note||t('Noch keine Beschreibung','No description'))}</p><span class="pill">${esc(x.v.severity||'S2')}</span><button onclick="jump('${x.id}')">${t('Öffnen','Open')}</button></div>`).join('')}${other.map(x=>`<div class="card danger"><strong>${esc(x.area)} · ${esc(x.title)}</strong><p>${esc(x.note)}</p><small>${new Date(x.created).toLocaleString(lang)}</small></div>`).join('')}<button onclick="addFinding('docs')">+ ${t('Spontanen Befund hinzufügen','Add finding')}</button>`}
function exportPage(){return `<h1>${t('Bericht & Sicherung','Report & backup')}</h1><div class="card"><h2>${t('Vollständiges Backup','Full backup')}</h2><p>${t('JSON-Sicherung inklusive Prüfungen, Konfiguration, Fotos und Historie. Die Datei an einem zweiten Speicherort ablegen.','JSON backup including results, configuration, photos and history. Save it separately.')}</p><button class="primary" onclick="backup()">↓ ${t('Backup herunterladen','Download backup')}</button><label class="field"><span>${t('Backup importieren','Import backup')}</span><input id="restore" type="file" accept="application/json,.json"></label><p class="muted small">${t('Import ersetzt nicht stillschweigend bestehende Projekte.','Import does not silently overwrite an existing project.')}</p></div><div class="card"><h2>${t('Prüfergebnisse exportieren','Export inspection results')}</h2><button onclick="csv()">↓ CSV (${t('Excel-kompatibel','Excel-compatible')})</button><button onclick="printInspection()">${t('Drucken / PDF','Print / PDF')}</button></div><div class="note">${t('Wichtig: Browserdaten können gelöscht werden. Die Anwendung bietet keine absolute Sicherung gegen Geräteverlust.','Browser data may be deleted. The app cannot guarantee protection against device loss.')}</div>`}
function ensureResult(id){if(!project.results[id])project.results[id]={status:'pending',part:'',wr:'',table:'',string:'',serial:'',inspector:lead()?.name||'',note:'',severity:'S2',owner:'',due:'',evidence:'',photos:[],created:now(),modified:now(),dayId:day()?.id||'',history:[]};return project.results[id]}
function setResult(id,k,v){if(k==='status'&&!roster().some(p=>p.name?.trim())){alert(t('Bitte zuerst mindestens einen Prüfer unter Prüftag eintragen.','Please enter at least one inspector in Inspection day first.'));go('day');return}const r=ensureResult(id);if(k==='status'&&v==='pass'&&id.endsWith('PLATE-PHOTO')&&!(r.photos||[]).length){alert(t('Bitte zuerst ein Typenschild-Foto anhängen.','Attach a nameplate photo first.'));return}if(!r.inspector&&lead())r.inspector=lead().name;const old=r[k];if(old===v)return;r[k]=v;r.modified=now();r.history.push({at:r.modified,field:k,old,new:v});save();if(k==='status')render()}
function bind(){if(page==='home'){getAll('projects').then(p=>{let el=$('projectList');if(!el)return;el.innerHTML=p.map(x=>`<div class="row between card"><div><strong>${esc(x.name||t('Ohne Namen','Unnamed'))}</strong><br><small>${esc(x.site)} · ${new Date(x.meta.modified).toLocaleString(lang)}</small></div><button data-open="${x.id}">${t('Öffnen','Open')}</button></div>`).join('');el.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openProject(b.dataset.open))})}if(page==='config'){for(let k of ['name','site','owner','dso','dc','ac'])bindField('p_'+k,v=>change(k,v));$('c_voltage').value=project.config.voltage;$('c_inv').value=project.config.inv;$('c_dcVoltage').value=project.config.dcVoltage||'1500';$('c_mountType').value=project.config.mountType||'ground';bindConfig()}if(page==='settings'){document.querySelectorAll('[data-global-id]').forEach(el=>touchInput(el,v=>{const p=globalInspectors.find(x=>x.id===el.dataset.globalId);if(p){p[el.dataset.globalKey]=v;saveGlobalInspectors()}}))}if(page==='day'){let d=day();document.querySelectorAll('[data-day-inspector]').forEach(el=>el.onchange=e=>{let ids=Array.isArray(d.inspectorIds)?[...d.inspectorIds]:(lead()?.id?[lead().id]:[]);if(e.target.checked){if(!ids.includes(e.target.dataset.dayInspector))ids.push(e.target.dataset.dayInspector)}else{if(ids.length<=1){e.target.checked=true;alert(t('Mindestens ein Prüfer erforderlich.','At least one inspector required.'));return}ids=ids.filter(x=>x!==e.target.dataset.dayInspector)}d.inspectorIds=ids;save()});document.querySelectorAll('[data-day-person]').forEach(el=>touchInput(el,v=>{const p=(d.people||[]).find(x=>x.id===el.dataset.dayPerson);if(p){p[el.dataset.personKey]=v;save()}}));$('daySelect').onchange=e=>{let i=project.days.findIndex(x=>x.id===e.target.value);if(i!==-1){let x=project.days.splice(i,1)[0];project.days.push(x);save();render()}};for(let k of ['date','start','end','weather','temp','wind','irr','notes'])bindField('day_'+k,v=>{d[k]=v;save()});document.querySelectorAll('[data-inspector]').forEach(el=>touchInput(el,v=>{let p=roster().find(x=>x.id===el.dataset.inspector);if(p){p[el.dataset.key]=v;if(!project.leadInspectorId)project.leadInspectorId=p.id;save()}}));$('leadInspector').onchange=e=>{project.leadInspectorId=e.target.value;save()}}if(page==='check'){const c=checks(selectedArea)[idx];if(!c)return;document.querySelectorAll('[data-result]').forEach(el=>{let r=ensureResult(c.id);touchInput(el,v=>setResult(c.id,el.dataset.result,v))});let pic=$('photoInput');if(pic)pic.onchange=async e=>{for(let file of e.target.files){if(file.size>8*1024*1024){alert(t('Foto über 8 MB. Bitte kleinere Datei wählen.','Photo exceeds 8MB. Choose a smaller file.'));continue}let data=await new Promise((ok,no)=>{const f=new FileReader();f.onload=()=>ok(f.result);f.onerror=()=>no(f.error);f.readAsDataURL(file)});let r=ensureResult(c.id);r.photos.push({name:file.name&&file.name!=='image.jpg'?file.name:'Foto_'+c.id+'_'+new Date().toISOString().replace(/[:.]/g,'-')+'.jpg',originalName:file.name||'',mime:file.type,data,at:now()});r.modified=now();await save()}render()}}if(page==='export'){$('restore').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let obj=JSON.parse(await f.text());if(obj.format!=='pv-inspection-backup-1'||!obj.project?.id)throw Error('Invalid format');let incoming=obj.project;const existing=(await getAll('projects')).find(x=>x.id===incoming.id);if(existing){if(!confirm(t('Projekt besteht bereits. Als Kopie importieren?','Project exists. Import as new copy?')))return;incoming.id=crypto.randomUUID();incoming.name+=' (Import)'}await put('projects',incoming);project=incoming;migrateCatalog(project);await save();go('home')}catch(e){alert(t('Import fehlgeschlagen: ','Import failed: ')+e.message)}}}}
function addPerson(){if(!Array.isArray(day().people))day().people=[];day().people.push({id:crypto.randomUUID(),name:'',company:'',role:'',from:'',to:''});save();render()}function removePerson(id){day().people=(day().people||[]).filter(p=>p.id!==id);save();render()}async function newProject(){if(!confirm(t('Neue Anlage anlegen? Die bisherigen Daten bleiben erhalten.','Create new plant? Existing data are retained.')))return;project=defaultProject();syncGlobalRoster();await save();go('config')}async function openProject(id){let x=(await getAll('projects')).find(v=>v.id===id);if(x){project=x;migrateCatalog(project);syncGlobalRoster();await save();go('home')}}function sameNext(){let c=checks(selectedArea)[idx],r=ensureResult(c.id);const clone=structuredClone(r);let id=c.id+'~'+crypto.randomUUID().slice(0,8);project.custom.push({...c,id,de:c.de+' (weiteres Prüfobjekt)',en:c.en+' (additional object)',condition:''});project.results[id]={...clone,status:'pending',serial:'',created:now(),modified:now(),history:[],photos:[]};save();idx=checks(selectedArea).findIndex(x=>x.id===id);render()}
function addCustom(area){let title=prompt(t('Neuer Prüfpunkt – Bezeichnung','New check – title'));if(!title?.trim())return;let method=prompt(t('Prüfmethode (optional)','Method (optional)'))||'';let id='USR-'+crypto.randomUUID().slice(0,8).toUpperCase();project.custom.push({id,area,de:title,en:title,method_de:method,method_en:method,condition:''});save();selectedArea=area;idx=checks(area).findIndex(c=>c.id===id);go('check')}
function addFinding(area){let title=prompt(t('Spontaner Befund – Kurzbezeichnung','Ad-hoc finding – title'));if(!title?.trim())return;let note=prompt(t('Befundbeschreibung','Finding description'))||'';project.findings.push({id:crypto.randomUUID(),area,title,note,created:now(),inspector:'',dayId:day()?.id||''});save();go('defects')}
function jump(id){let c=catalog.checks.concat(project.custom).find(x=>x.id===id);if(c){selectedArea=c.area;idx=checks(selectedArea).findIndex(x=>x.id===id);go('check')}}function downloadPhoto(id,i){let p=ensureResult(id).photos[i];if(!p)return;let a=document.createElement('a');a.href=p.data;a.download=p.name||'photo.jpg';a.click()}function removePhoto(id,i){if(!confirm(t('Foto entfernen?','Remove photo?')))return;let r=ensureResult(id);r.photos.splice(i,1);r.modified=now();save();render()}
function printInspection(){const escText=x=>esc(x||'—');const team=roster();const items=allChecks().filter(c=>project.results[c.id]?.status&&project.results[c.id].status!=='pending');const areaName=id=>catalog.areas.find(a=>a.id===id)?.[lang]||id;let out=`<div class="report-title"><h1>PV Inspection · ${escText(project.name)}</h1><p>${escText(project.site)} · ${t('Datum','Date')}: ${new Date().toLocaleDateString(lang)} · ${t('Export','Export')}: ${new Date().toLocaleString(lang)}</p></div><h2>${t('Anlagendaten','Plant details')}</h2><p>${t('Betreiber','Owner')}: ${escText(project.owner)} · ${t('Netzbetreiber','DSO')}: ${escText(project.dso)} · DC: ${escText(project.dc)} kWp · AC: ${escText(project.ac)}</p><h2>${t('Prüfteam','Inspection team')}</h2><p>${team.map(p=>escText(p.name)+' ('+escText(p.company)+')').join('; ')||'—'}</p><p>${t('Verantwortlich','Responsible')}: ${escText(lead()?.name)}</p><h2>${t('Prüfungstage und Wetter','Inspection days and weather')}</h2>${project.days.map(d=>`<p>${escText(d.date)} · ${escText(d.weather)} · ${t('Temperatur','Temperature')}: ${escText(d.temp)} °C · ${t('Wind','Wind')}: ${escText(d.wind)} m/s</p>`).join('')}<h2>${t('Prüfergebnisse','Inspection results')} (${items.length}/${allChecks().length})</h2>`;for(let c of items){let r=project.results[c.id];out+=`<div class="report-card"><strong>${esc(c.id)} · ${esc(areaName(c.area))}: ${esc(c[lang])}</strong><p><b>${esc(r.status.toUpperCase())}</b> · ${t('Prüfer','Inspector')}: ${escText(inspectorValue(r.inspector))}</p><p>${t('Prüfobjekt','Object')}: ${[r.part,r.wr,r.table,r.string,r.serial].filter(Boolean).map(esc).join(' / ')||'—'}</p>${r.measured!==undefined&&r.measured!==''?`<p>${t('Ist-Wert','Measured value')}: ${esc(r.measured)} ${esc(c.measurement?.unit||'')}</p>`:''}${r.note?`<p>${t('Befund','Finding')}: ${esc(r.note)}</p>`:''}<p class="report-meta">${t('Erfasst','Created')}: ${escText(r.created)} · ${t('Geändert','Modified')}: ${escText(r.modified)} · ${t('Schwere','Severity')}: ${escText(r.severity)}</p>${(r.photos||[]).map(p=>`<figure><img class="report-photo" src="${p.data}" alt="${esc(p.name)}"><figcaption>${esc(p.name)}</figcaption></figure>`).join('')}</div>`}out+=`<h2>${t('Spontane Befunde','Additional findings')}</h2>`+project.findings.map(f=>`<div class="report-card"><strong>${esc(f.title)}</strong><p>${esc(f.note)}</p></div>`).join('');const node=$('printReport');node.innerHTML=out;node.setAttribute('aria-hidden','false');setTimeout(()=>window.print(),300)}
window.addEventListener('afterprint',()=>{const node=$('printReport');node.innerHTML='';node.setAttribute('aria-hidden','true')});
function download(name,content,type){const b=new Blob([content],{type});let url=URL.createObjectURL(b);let a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}function backup(){download('PV-Inspection-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify({format:'pv-inspection-backup-1',exported:now(),catalog,project},null,2),'application/json')}function csv(){let h=['ID','DE','EN','Area','Status','Plant section','Inverter','Table','String','Module SN','Inspector','Finding','Severity','Created UTC','Modified UTC'];let body=allChecks().map(c=>{let r=project.results[c.id]||{};return [c.id,c.de,c.en,c.area,r.status||'pending',r.part,r.wr,r.table,r.string,r.serial,r.inspector,r.note,r.severity,r.created,r.modified].map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')});download('PV-Inspection.csv','\ufeff'+[h.join(';'),...body].join('\r\n'),'text/csv;charset=utf-8')}
$('language').onchange=e=>{lang=e.target.value;localStorage.setItem('pv-lang',lang);document.documentElement.lang=lang;render()};async function init(){try{db=await openDb();let projects=await getAll('projects');let s=(await getAll('app')).find(x=>x.key==='current');project=projects.find(x=>x.id===s?.id)||projects[0]||defaultProject();if(!projects.length)await save();if(!project.days.length){addDay();await queue}const g=(await getAll('app')).find(x=>x.key==='inspectors-global');globalInspectors=Array.isArray(g?.people)?g.people:[];roster();if(!globalInspectors.length){globalInspectors=roster().filter(p=>p.name?.trim()).map(p=>({id:p.id,name:p.name,company:p.company||'',role:p.role||''}));if(globalInspectors.length)await put('app',{key:'inspectors-global',people:structuredClone(globalInspectors)})}syncGlobalRoster();if(!project.inspectors.length){project.inspectors.push({id:crypto.randomUUID(),name:'',company:'',role:''})}if(!project.leadInspectorId)project.leadInspectorId=project.inspectors[0].id;await save();status(t('✓ Lokal gespeichert','✓ Saved locally'));render();if(navigator.storage?.persist)navigator.storage.persist().catch(()=>{})}catch(e){status('⚠ IndexedDB unavailable');$('app').innerHTML='<div class="card danger"><h1>Lokale Speicherung nicht verfügbar / Local storage unavailable</h1><p>'+esc(e.message)+'</p><p>Browser-Einstellungen prüfen. Ohne zuverlässige lokale Speicherung ist die Datenerfassung deaktiviert.</p></div>'}}init();
</script><script>if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost')){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(console.warn));}</script><script>
(function(){
 const v=document.querySelector('meta[name="pv-release"]')?.content || '0.4.6';
 const d=document.querySelector('meta[name="pv-update"]')?.content || '2026-10-26';
 const element=document.getElementById('releaseInfo');
 const language=document.getElementById('language');
 function showRelease(){
  const date=d.split('-').reverse().join('.');
  element.textContent=(language?.value==='en'?'Version '+v+' · Updated '+date:'Version '+v+' · Aktualisiert '+date);
 }
 showRelease(); language?.addEventListener('change',showRelease);
})();
